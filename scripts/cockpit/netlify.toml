[functions]
  directory = "netlify/functions"
  included_files = ["index.html"]

[[redirects]]
  from = "/"
  to = "/.netlify/functions/private-cockpit"
  status = 200
  force = true

[[redirects]]
  from = "/index.html"
  to = "/.netlify/functions/private-cockpit"
  status = 200
  force = true

[[redirects]]
  from = "/auth/success"
  to = "/.netlify/functions/private-cockpit"
  status = 200
  force = true
