<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- LightKamel - Camel stylisé avec touches gold et cobalt -->
  <defs>
    <linearGradient id="camelGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D6B25C"/>
      <stop offset="100%" style="stop-color:#A07C22"/>
    </linearGradient>
    <linearGradient id="camelCobalt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B3F8B"/>
      <stop offset="100%" style="stop-color:#7FA0DF"/>
    </linearGradient>
  </defs>
  
  <!-- Corps -->
  <ellipse cx="50" cy="55" rx="35" ry="18" fill="url(#camelGold)" stroke="#1B3F8B" stroke-width="2"/>
  
  <!-- Tête -->
  <ellipse cx="75" cy="35" rx="12" ry="10" fill="url(#camelGold)" stroke="#1B3F8B" stroke-width="2"/>
  
  <!-- Bosses -->
  <circle cx="68" cy="28" r="4" fill="url(#camelGold)" stroke="#1B3F8B" stroke-width="1.5"/>
  <circle cx="82" cy="28" r="4" fill="url(#camelGold)" stroke="#1B3F8B" stroke-width="1.5"/>
  
  <!-- Yeux -->
  <circle cx="72" cy="32" r="2" fill="#1B3F8B"/>
  <circle cx="78" cy="32" r="2" fill="#1B3F8B"/>
  
  <!-- Nez -->
  <ellipse cx="75" cy="38" rx="2" ry="1.5" fill="#566B41"/>
  
  <!-- Bouche (sourire) -->
  <path d="M72 40 Q75 42 78 40" stroke="#566B41" stroke-width="1.5" fill="none"/>
  
  <!-- Pattes avant -->
  <ellipse cx="65" cy="68" rx="2" ry="8" fill="url(#camelGold)" stroke="#1B3F8B" stroke-width="1.5"/>
  <ellipse cx="75" cy="68" rx="2" ry="8" fill="url(#camelGold)" stroke="#1B3F8B" stroke-width="1.5"/>
  
  <!-- Pattes arrière -->
  <ellipse cx="35" cy="68" rx="2" ry="8" fill="url(#camelGold)" stroke="#1B3F8B" stroke-width="1.5"/>
  <ellipse cx="45" cy="68" rx="2" ry="8" fill="url(#camelGold)" stroke="#1B3F8B" stroke-width="1.5"/>
  
  <!-- Queue -->
  <path d="M25 55 Q20 50 22 45" stroke="url(#camelGold)" stroke-width="2" fill="none"/>
  <circle cx="22" cy="45" r="2" fill="url(#camelGold)" stroke="#1B3F8B" stroke-width="1.5"/>
</svg>
