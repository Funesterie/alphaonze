# SonarQube Configuration for A11 Backend
# Project identification
sonar.projectKey=a11-backend-server
sonar.projectName=A11 Backend Server
sonar.projectVersion=1.0.0

# Source code location
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/test/**,**/tests/**,**/*.test.cjs,**/*.spec.cjs,**/llama.cpp/**,**/runtime/**,**/logs/**,**/generated/**,**/migrations/**

# Test files
sonar.tests=test,tests
sonar.test.inclusions=**/*.test.cjs,**/*.spec.cjs,**/*.e2e.cjs

# JavaScript/Node.js specific
sonar.javascript.node.maxspace=4096
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Code coverage (if available)
sonar.coverage.exclusions=**/*.test.cjs,**/*.spec.cjs,**/*.e2e.cjs,**/test/**,**/tests/**

# Security hotspots to focus on
sonar.security.hotspots.enabled=true

# Stripe integration - specific rules
# Focus on security for payment processing
sonar.issue.ignore.multicriteria=e1,e2,e3

# Ignore cognitive complexity warnings for large legacy functions
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S3776
sonar.issue.ignore.multicriteria.e1.resourceKey=server.cjs

# Ignore function parameter count for legacy code
sonar.issue.ignore.multicriteria.e2.ruleKey=javascript:S107
sonar.issue.ignore.multicriteria.e2.resourceKey=server.cjs

# Ignore nested template literals for legacy code
sonar.issue.ignore.multicriteria.e3.ruleKey=javascript:S6606
sonar.issue.ignore.multicriteria.e3.resourceKey=server.cjs

# Security rules to enforce strictly
# - SQL injection prevention
# - XSS prevention
# - CSRF protection
# - Secure random number generation
# - Hardcoded credentials detection
sonar.security.rules=javascript:S2068,javascript:S3649,javascript:S2245,javascript:S5852,javascript:S5131

# Quality gate
sonar.qualitygate.wait=false
