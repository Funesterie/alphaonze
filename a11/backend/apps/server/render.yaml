# Render Blueprint pour A11 Backend API fallback
# Documentation: https://render.com/docs/blueprint-spec
#
# Source de verite routage:
# - Le trafic public principal reste Cloudflare -> Hetzner -> Caddy.
# - Render est un secours API seulement. Ne pas y router le chat, la voix,
#   la vision, la video, Qflush ou Ollama en fonctionnement normal.
# - Les URLs publiques restent funesterie.me / a11.funesterie.me via Caddy.

services:
  # Backend API
  - type: web
    name: a11-backend
    runtime: node
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    region: frankfurt
    plan: free
    branch: master
    rootDir: a11/backend/apps/server
    healthCheckPath: /health
    envVars:
      # Backend Config
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: HOST_SERVER
        value: 0.0.0.0
      - key: BACKEND
        value: render-fallback
      - key: A11_DEPLOY_ROLE
        value: fallback

      # Security
      - key: NEZ_SECURITY_MODE
        value: production
      - key: JWT_SECRET
        sync: false # Secret, à configurer manuellement
      - key: JWT_EXPIRY
        value: 7d
      - key: A11_FULL_ACCESS_EMAILS
        value: cellaurojeffrey@gmail.com,marvincellauro@gmail.com,giovannabrunetto@gmail.com,bayetgerard@gmail.com,boostro38@gmail.com,jewitt.charlene@gmail.com,charlenejewitt@gmail.com,jeffrey38330@gmail.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: A11_GOOGLE_CLIENT_ID
        sync: false

      # CORS
      - key: CORS_ORIGINS
        value: https://funesterie.me,https://a11.funesterie.me,https://k44.funesterie.me,https://vivy.funesterie.me
      - key: APP_URL
        value: https://a11.funesterie.me
      - key: PUBLIC_API_URL
        value: https://a11.funesterie.me
      - key: GOOGLE_CALLBACK_URL
        value: https://a11.funesterie.me/api/auth/google/callback
      - key: A11_GOOGLE_CALLBACK_URL
        value: https://a11.funesterie.me/api/auth/google/callback

      # LLM
      - key: A11_LLM_PROVIDER
        value: groq
      - key: OLLAMA_BASE
        value: http://a11-ollama:11434
      - key: A11_OLLAMA_PRIMARY_MODEL
        value: gpt-oss:20b-cloud
      - key: A11_OLLAMA_FALLBACK_MODEL
        value: llama3.2:latest
      - key: LOCAL_DEFAULT_MODEL
        value: gpt-oss:20b-cloud
      - key: DEFAULT_MODEL
        value: gpt-oss:20b-cloud
      - key: OPENAI_MODEL
        value: meta-llama/llama-3.3-70b-instruct
      - key: A11_OPENAI_MODEL
        value: meta-llama/llama-3.3-70b-instruct
      - key: A11_AGENT_MODEL
        value: gpt-oss:20b-cloud
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: A11_OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: A11_LLM_TIMEOUT_MS
        value: 60000
      - key: OPENAI_API_KEY
        sync: false # Secret, à configurer manuellement
      - key: A11_OPENAI_API_KEY
        sync: false # Secret, alias A11
      - key: A11_LLM_LLAMA
        sync: false # Secret Ollama Cloud/API key, alias local pour OLLAMA_API_KEY
      - key: OLLAMA_API_KEY
        sync: false # Secret officiel Ollama Cloud si on pointe vers https://ollama.com/api
      - key: GEMINI_API_KEY
        sync: false # Secret Gemini
      - key: GOOGLE_GENAI_API_KEY
        sync: false # Secret Gemini/Google GenAI
      - key: XAI_API_KEY
        sync: false # Secret xAI
      - key: MISTRAL_API_KEY
        sync: false # Secret Mistral

      # LLM Fallbacks (optionnel)
      - key: A11_LLM_RUNTIME_FALLBACK_ORDER
        value: ollama,openai,gemini,xai,huggingface,deepseek,together
      - key: A11_LLM_FALLBACK_PROVIDER
        value: ollama # groq d'abord, puis secours local si le cloud tombe
      - key: GROQ_API_KEY
        sync: false # Secret, à configurer manuellement
      - key: GROQ_MODEL
        value: meta-llama/llama-3.3-70b-instruct
      - key: DEEPSEEK_API_KEY
        sync: false # Secret, à configurer manuellement
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: TOGETHER_API_KEY
        sync: false # Secret, à configurer manuellement
      - key: TOGETHER_MODEL
        value: meta-llama/Llama-3.3-70B-Instruct-Turbo
      - key: HF_API_KEY
        sync: false # Secret, à configurer manuellement
      - key: HUGGINGFACE_API_KEY
        sync: false # Secret, alias Hugging Face
      - key: HF_MODEL
        value: meta-llama/Llama-3.1-8B-Instruct

      # Stripe
      - key: STRIPE_SECRET_KEY
        sync: false # Secret, à configurer manuellement
      - key: STRIPE_PRICE_ID
        value: price_1TdqwVHkqLcMgv54LWqd5jEb
      - key: STRIPE_PREMIUM_PRICE_ID
        value: price_1TdqwVHkqLcMgv54LWqd5jEb
      - key: STRIPE_FOUNDER_PRICE_ID
        value: price_1TdqwWHkqLcMgv54ZFUAbVFl
      - key: STRIPE_WEBHOOK_SECRET
        sync: false # Secret, à configurer manuellement
      - key: STRIPE_WEBHOOK_URL
        value: https://a11.funesterie.me/api/subscription/webhook
      - key: STRIPE_SUCCESS_URL
        value: https://funesterie.me/subscription/success
      - key: STRIPE_CANCEL_URL
        value: https://funesterie.me/subscription/cancel
      - key: STRIPE_PORTAL_RETURN_URL
        value: https://funesterie.me/compte/

      # PayPal
      - key: PAYPAL_ENV
        value: live
      - key: PAYPAL_CLIENT_ID
        sync: false # Secret store
      - key: PAYPAL_CLIENT_SECRET
        sync: false # Secret store
      - key: PAYPAL_WEBHOOK_ID
        sync: false # Secret store
      - key: PAYPAL_PUBLIC_BASE_URL
        value: https://funesterie.me
      - key: PAYPAL_WEBHOOK_URL
        value: https://a11.funesterie.me/api/paypal/webhook
      - key: PAYPAL_RECEIVER_EMAIL
        value: cellaurojeffrey@hotmail.com
      - key: RESEND_API_KEY
        sync: false # Secret, à configurer manuellement
      - key: EMAIL_FROM
        value: A11 <a11@funesterie.me>

      # Databases (à configurer avec les URLs Render)
      - key: DATABASE_URL
        fromDatabase:
          name: a11-postgres
          property: connectionString

      # Features
      - key: A11_ENABLE_QFLUSH
        value: 0
      - key: MANAGE_CERBERE
        value: false
      - key: MANAGE_TTS
        value: false

databases:
  # PostgreSQL
  - name: a11-postgres
    databaseName: a11
    plan: basic-256mb
    region: frankfurt
    ipAllowList: [] # Allow all IPs
