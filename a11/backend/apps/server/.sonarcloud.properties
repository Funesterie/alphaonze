# SonarCloud Configuration for A11 Backend
# This file is used when analyzing with SonarCloud instead of local SonarQube

# Organization (if using SonarCloud)
# sonar.organization=your-org-key

# Project identification
sonar.projectKey=funesterie_a11-backend
sonar.projectName=A11 Backend Server
sonar.projectVersion=1.0.0

# Source code location
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/test/**,**/tests/**,**/*.test.cjs,**/*.spec.cjs,**/llama.cpp/**,**/runtime/**,**/logs/**,**/generated/**,**/migrations/**

# Test files
sonar.tests=test,tests
sonar.test.inclusions=**/*.test.cjs,**/*.spec.cjs,**/*.e2e.cjs

# JavaScript/Node.js specific
sonar.javascript.node.maxspace=4096
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Links
sonar.links.homepage=https://funesterie.pro
sonar.links.ci=https://railway.app
sonar.links.scm=https://github.com/funesterie/funesterie
sonar.links.issue=https://github.com/funesterie/funesterie/issues
