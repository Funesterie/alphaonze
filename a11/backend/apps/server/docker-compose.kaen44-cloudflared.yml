services:
  kaen44-cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: kaen44-cloudflared
    restart: unless-stopped
    network_mode: host
    user: "0:0"
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ${KAEN44_CLOUDFLARED_DIR:-/home/deploy/cloudflared-kaen44}:/etc/cloudflared:ro
