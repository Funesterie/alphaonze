[build]
  base = "."
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/*"
  to = "https://api.funesterie.pro/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/installHook.js.map"
  to = "/installHook.js.map"
  status = 200

[[redirects]]
  from = "/react_devtools_backend_compact.js.map"
  to = "/react_devtools_backend_compact.js.map"
  status = 200

[[redirects]]
  from = "/%3Canonymous%20code%3E"
  to = "/anonymous_code_placeholder.js"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
