<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vivy - Funesterie</title>
    <meta name="description" content="Vivy, présence musicale Funesterie pour voix, chansons originales et projets audio Nossen." />
    <meta property="og:title" content="Vivy - Présence musicale Funesterie" />
    <meta property="og:description" content="Voix, musique, composition, clips et publications audio liés aux projets créatifs Funesterie." />
    <meta property="og:image" content="/vivy-presence-musicale.png" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #05030a;
        --ink: #fbe7f8;
        --muted: #e8bfdc;
        --pink: #f079d8;
        --line: rgba(240, 121, 216, 0.36);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif;
        overflow-x: hidden;
      }

      a {
        color: inherit;
      }

      .vivy-page {
        position: relative;
        min-height: 100vh;
        display: grid;
        grid-template-columns: minmax(260px, 360px) minmax(0, 1fr) minmax(280px, 360px);
        gap: 28px;
        width: min(1520px, 100%);
        margin: 0 auto;
        overflow: hidden;
      }

      .vivy-bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 50%;
        opacity: 0.28;
        filter: saturate(1.1) contrast(1.08);
      }

      .vivy-page::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 1;
        background:
          linear-gradient(90deg, rgba(4, 2, 9, 0.94), rgba(4, 2, 9, 0.48) 32%, rgba(4, 2, 9, 0.12) 58%, rgba(4, 2, 9, 0.88) 78%, #040209),
          linear-gradient(180deg, rgba(4, 2, 9, 0.16), #040209 92%);
      }

      .vivy-left,
      .vivy-portrait,
      .vivy-right,
      .vivy-bottom {
        position: relative;
        z-index: 2;
      }

      .vivy-left {
        align-self: center;
        padding: clamp(34px, 5vw, 76px) 0 96px clamp(22px, 3vw, 54px);
      }

      .vivy-logo {
        margin: 0 0 34px;
        color: var(--pink);
        font-family: "Segoe Script", "Brush Script MT", Georgia, serif;
        font-size: clamp(92px, 9vw, 158px);
        line-height: 0.76;
        text-shadow: 0 0 34px rgba(240, 121, 216, 0.38);
      }

      .vivy-kicker {
        margin: 0 0 28px;
        color: #f8d5ef;
        text-transform: uppercase;
        font-size: 21px;
        line-height: 1.35;
      }

      .vivy-kicker::after {
        content: "";
        display: block;
        width: 72px;
        height: 1px;
        margin-top: 15px;
        background: var(--line);
      }

      .vivy-lead {
        max-width: 300px;
        margin: 0 0 28px;
        color: #f3d9ec;
        font-size: 17px;
        line-height: 1.5;
      }

      .vivy-block {
        margin-top: 28px;
      }

      .vivy-block h2,
      .vivy-right h2 {
        margin: 0 0 10px;
        color: var(--pink);
        text-transform: uppercase;
        font-size: 13px;
        font-weight: 850;
      }

      .vivy-block ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .vivy-block li {
        position: relative;
        margin: 7px 0;
        padding-left: 18px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.35;
      }

      .vivy-block li::before {
        content: "*";
        position: absolute;
        left: 0;
        top: 0;
        color: var(--pink);
        font-weight: 900;
      }

      .vivy-portrait {
        min-height: 760px;
        border-inline: 1px solid rgba(240, 121, 216, 0.16);
        overflow: hidden;
      }

      .vivy-portrait img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        object-position: 49% 50%;
      }

      .vivy-right {
        padding: clamp(38px, 5vw, 72px) clamp(20px, 3vw, 44px) 96px 0;
        background: linear-gradient(180deg, rgba(4, 2, 9, 0.92), rgba(4, 2, 9, 0.78));
      }

      .vivy-right h2 {
        color: #f8d4ef;
        text-align: center;
        font-size: 23px;
        letter-spacing: 0.03em;
      }

      .vivy-right > p {
        max-width: 270px;
        margin: 0 auto 28px;
        color: #eed3e7;
        text-align: center;
        font-size: 17px;
        line-height: 1.5;
      }

      .vivy-card {
        margin: 20px 0;
        border: 1px solid rgba(240, 121, 216, 0.38);
        background: rgba(5, 3, 11, 0.72);
      }

      .vivy-card img {
        width: 100%;
        aspect-ratio: 1.72;
        display: block;
        object-fit: cover;
      }

      .vivy-card h3 {
        margin: 11px 12px 4px;
        color: var(--pink);
        text-align: center;
        text-transform: uppercase;
        font-size: 13px;
      }

      .vivy-card p {
        margin: 0 12px 13px;
        color: #d9bfd2;
        text-align: center;
        font-size: 13px;
        line-height: 1.35;
      }

      .vivy-quote {
        margin: 30px 0 0;
        color: #f3d8ea;
        font-size: 19px;
        line-height: 1.35;
      }

      .vivy-quote cite {
        display: block;
        margin-top: 10px;
        color: var(--pink);
        font-family: "Segoe Script", "Brush Script MT", Georgia, serif;
        font-size: 44px;
        font-style: normal;
        text-align: right;
      }

      .vivy-bottom {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        min-height: 72px;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        border-top: 1px solid rgba(240, 121, 216, 0.24);
        background: rgba(2, 1, 5, 0.82);
        backdrop-filter: blur(14px);
      }

      .vivy-bottom a {
        min-width: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        border-right: 1px solid rgba(240, 121, 216, 0.22);
        color: var(--pink);
        text-decoration: none;
        text-transform: uppercase;
        font-size: 14px;
        font-weight: 850;
      }

      .vivy-wave {
        width: 64px;
        height: 22px;
        background: repeating-linear-gradient(90deg, currentColor 0 2px, transparent 2px 7px);
        mask-image: linear-gradient(180deg, transparent 8%, black 48%, transparent 92%);
        opacity: 0.78;
      }

      @media (max-width: 1120px) {
        .vivy-page {
          grid-template-columns: minmax(0, 0.95fr) minmax(320px, 1.05fr);
        }

        .vivy-right {
          grid-column: 1 / -1;
          display: grid;
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: 14px;
          padding: 0 18px 96px;
        }

        .vivy-right h2,
        .vivy-right > p,
        .vivy-quote {
          grid-column: 1 / -1;
        }

        .vivy-card {
          margin: 0;
        }
      }

      @media (max-width: 720px) {
        .vivy-page {
          display: flex;
          flex-direction: column;
          min-height: 100vh;
          overflow: visible;
        }

        .vivy-left {
          order: 2;
          padding: 30px 20px 10px;
        }

        .vivy-lead {
          max-width: none;
        }

        .vivy-portrait {
          order: 1;
          min-height: 520px;
          border: 1px solid rgba(240, 121, 216, 0.18);
        }

        .vivy-right {
          order: 3;
          display: block;
          padding: 24px 20px 22px;
        }

        .vivy-card {
          margin: 16px 0;
        }

        .vivy-bottom {
          position: relative;
          order: 4;
          grid-template-columns: 1fr;
          margin: 0 20px 20px;
          border: 1px solid rgba(240, 121, 216, 0.24);
        }

        .vivy-bottom a {
          min-height: 58px;
          justify-content: flex-start;
          padding: 0 18px;
          border-right: 0;
          border-bottom: 1px solid rgba(240, 121, 216, 0.16);
        }
      }

      .vivy-poster-page {
        min-height: 100vh;
        background:
          radial-gradient(circle at 50% 4%, rgba(240, 121, 216, 0.13), transparent 34%),
          linear-gradient(180deg, #05030a 0%, #020104 100%);
      }

      .vivy-top {
        position: sticky;
        top: 0;
        z-index: 10;
        min-height: 68px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: 12px clamp(14px, 3vw, 36px);
        border-bottom: 1px solid rgba(240, 121, 216, 0.22);
        background: rgba(5, 3, 10, 0.84);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
      }

      .vivy-top strong {
        color: var(--pink);
        font-family: "Segoe Script", "Brush Script MT", Georgia, serif;
        font-size: 32px;
        line-height: 1;
      }

      .vivy-top div {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        flex-wrap: wrap;
        gap: 10px;
      }

      .vivy-top a {
        min-height: 38px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(240, 121, 216, 0.28);
        border-radius: 999px;
        padding: 0 14px;
        color: #f8d4ef;
        text-decoration: none;
        font-size: 12px;
        font-weight: 850;
        text-transform: uppercase;
      }

      .vivy-poster-stage {
        width: 100%;
        min-height: calc(100svh - 68px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: clamp(12px, 2.2vw, 28px);
        overflow: hidden;
      }

      .vivy-poster-stage:focus-visible {
        outline: 2px solid rgba(240, 121, 216, 0.72);
        outline-offset: -4px;
      }

      .vivy-poster-frame {
        position: relative;
        width: min(100%, 1500px);
        background: #05030a;
        border: 1px solid rgba(240, 121, 216, 0.3);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.56), 0 0 48px rgba(240, 121, 216, 0.12);
      }

      .vivy-poster-frame img {
        display: block;
        width: 100%;
        height: auto;
      }

      .vivy-mobile-slices {
        display: none;
      }

      .vivy-poster-hotspots {
        position: absolute;
        inset: 0;
        z-index: 3;
        pointer-events: none;
      }

      .vivy-poster-hotspots button {
        position: absolute;
        right: 2.35%;
        width: 18.2%;
        height: 18.7%;
        border: 0;
        border-radius: 8px;
        background: transparent;
        box-shadow: none;
        cursor: pointer;
        opacity: 0;
        pointer-events: auto;
      }

      .vivy-poster-hotspots button[data-vivy-jump="voice"] {
        top: 22.4%;
      }

      .vivy-poster-hotspots button[data-vivy-jump="song"] {
        top: 46%;
      }

      .vivy-poster-hotspots button[data-vivy-jump="share"] {
        top: 70.1%;
      }

      .vivy-poster-hotspots button:hover {
        background: rgba(240, 121, 216, 0.08);
      }

      .vivy-poster-hotspots button:focus-visible {
        opacity: 1;
        background: rgba(240, 121, 216, 0.1);
        box-shadow: 0 0 0 2px rgba(255, 210, 244, 0.78), 0 0 24px rgba(240, 121, 216, 0.2);
        outline: 2px solid transparent;
        outline-offset: 3px;
      }

      .vivy-chat {
        width: min(100% - clamp(24px, 4vw, 56px), 1500px);
        margin: 0 auto clamp(20px, 4vw, 42px);
        padding: clamp(16px, 2.6vw, 28px);
        border: 1px solid rgba(240, 121, 216, 0.28);
        background: linear-gradient(135deg, rgba(240, 121, 216, 0.14), transparent 42%), rgba(5, 3, 10, 0.82);
        box-shadow: 0 20px 64px rgba(0, 0, 0, 0.32);
      }

      .vivy-chat-head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 14px;
      }

      .vivy-chat-head h2 {
        margin: 0;
        color: #ffd2f4;
        font-size: clamp(22px, 2.6vw, 34px);
        line-height: 1.08;
      }

      .vivy-chat-head p,
      .vivy-chat-status {
        margin: 8px 0 0;
        color: #e8bfdc;
        font-size: 14px;
        line-height: 1.45;
      }

      .vivy-chat button,
      .vivy-chat textarea {
        font: inherit;
        letter-spacing: 0;
      }

      .vivy-chat button {
        min-height: 40px;
        border: 1px solid rgba(240, 121, 216, 0.34);
        border-radius: 8px;
        padding: 0 13px;
        background: rgba(240, 121, 216, 0.12);
        color: #ffd2f4;
        font-size: 12px;
        font-weight: 850;
        text-transform: uppercase;
        cursor: pointer;
      }

      .vivy-chat button:hover,
      .vivy-chat button:focus-visible {
        border-color: rgba(240, 121, 216, 0.82);
        background: rgba(240, 121, 216, 0.22);
      }

      .vivy-chat button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }

      .vivy-chat-log {
        display: grid;
        gap: 10px;
        max-height: min(46svh, 460px);
        overflow: auto;
        padding: 12px;
        border: 1px solid rgba(240, 121, 216, 0.18);
        background: rgba(1, 1, 5, 0.54);
      }

      .vivy-chat-message {
        width: min(82%, 860px);
        display: grid;
        gap: 6px;
        padding: 12px 14px;
        border: 1px solid rgba(240, 121, 216, 0.2);
        background: rgba(17, 10, 28, 0.78);
      }

      .vivy-chat-message.is-user {
        justify-self: end;
        background: rgba(240, 121, 216, 0.18);
      }

      .vivy-chat-message span {
        color: #f079d8;
        font-size: 11px;
        font-weight: 900;
        text-transform: uppercase;
      }

      .vivy-chat-message p {
        margin: 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        color: #fff3fc;
        font-size: 14px;
        line-height: 1.48;
      }

      .vivy-chat-file-list,
      .vivy-chat-attachments {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .vivy-chat-file-list span,
      .vivy-chat-attachments span {
        max-width: min(100%, 360px);
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 28px;
        border: 1px solid rgba(240, 121, 216, 0.24);
        border-radius: 999px;
        padding: 0 9px;
        background: rgba(240, 121, 216, 0.1);
        color: #f7d6ef;
        font-size: 12px;
        font-weight: 750;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .vivy-chat-attachments {
        margin-top: 10px;
      }

      .vivy-chat-attachments button {
        min-height: 22px;
        width: 22px;
        padding: 0;
        border-radius: 999px;
        line-height: 1;
      }

      .vivy-chat-compose {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        margin-top: 12px;
        align-items: stretch;
      }

      .vivy-chat-compose textarea {
        width: 100%;
        min-width: 0;
        min-height: 84px;
        border: 1px solid rgba(240, 121, 216, 0.28);
        border-radius: 8px;
        background: rgba(2, 1, 5, 0.72);
        color: #fff3fc;
        padding: 12px;
        font-size: 14px;
        line-height: 1.4;
        resize: vertical;
        outline: none;
      }

      .vivy-chat-compose textarea:focus {
        border-color: rgba(240, 121, 216, 0.78);
        box-shadow: 0 0 0 3px rgba(240, 121, 216, 0.12);
      }

      .vivy-chat-compose div {
        min-width: 150px;
        display: grid;
        gap: 8px;
      }

      .vivy-chat-compose button[type="submit"] {
        background: linear-gradient(135deg, #f079d8, #8f3eff);
        color: #120516;
        border-color: transparent;
      }

      .vivy-chat-reference {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-top: 10px;
        border: 1px solid rgba(240, 121, 216, 0.22);
        border-radius: 8px;
        padding: 9px 10px;
        background: rgba(240, 121, 216, 0.08);
      }

      .vivy-chat-reference span {
        min-width: 0;
        color: #f7d6ef;
        font-size: 13px;
        font-weight: 760;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .vivy-studio {
        width: min(100% - clamp(24px, 4vw, 56px), 1500px);
        margin: 0 auto clamp(32px, 6vw, 76px);
        padding: clamp(18px, 3vw, 34px);
        border: 1px solid rgba(240, 121, 216, 0.3);
        background:
          linear-gradient(135deg, rgba(240, 121, 216, 0.12), transparent 34%),
          linear-gradient(180deg, rgba(15, 8, 22, 0.94), rgba(5, 3, 10, 0.96));
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.38);
      }

      .vivy-studio-head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 22px;
      }

      .vivy-studio-head h2,
      .vivy-studio-form h3,
      .vivy-studio-brief h3 {
        margin: 0;
        color: #ffd2f4;
        font-size: clamp(24px, 3vw, 40px);
        line-height: 1.04;
      }

      .vivy-studio-head p {
        max-width: 650px;
        margin: 10px 0 0;
        color: #e8bfdc;
        font-size: 15px;
        line-height: 1.5;
      }

      .vivy-studio button,
      .vivy-studio input,
      .vivy-studio select,
      .vivy-studio textarea {
        font: inherit;
        letter-spacing: 0;
      }

      .vivy-studio button {
        min-height: 42px;
        border: 1px solid rgba(240, 121, 216, 0.34);
        border-radius: 8px;
        padding: 0 14px;
        background: rgba(240, 121, 216, 0.12);
        color: #ffd2f4;
        font-size: 12px;
        font-weight: 850;
        text-transform: uppercase;
        cursor: pointer;
      }

      .vivy-studio button:hover,
      .vivy-studio button:focus-visible {
        border-color: rgba(240, 121, 216, 0.82);
        background: rgba(240, 121, 216, 0.22);
      }

      .vivy-studio button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }

      .vivy-studio-grid {
        display: grid;
        grid-template-columns: minmax(230px, 0.72fr) minmax(320px, 1fr) minmax(320px, 1.05fr);
        gap: 14px;
      }

      .vivy-studio-modes {
        display: grid;
        gap: 10px;
        align-content: start;
      }

      .vivy-studio-modes button {
        min-height: 118px;
        display: grid;
        align-content: center;
        gap: 9px;
        padding: 16px;
        text-align: left;
        text-transform: none;
      }

      .vivy-studio-modes button.is-active {
        border-color: rgba(240, 121, 216, 0.9);
        background: linear-gradient(135deg, rgba(240, 121, 216, 0.26), rgba(98, 31, 94, 0.18));
        box-shadow: inset 3px 0 0 #f079d8;
      }

      .vivy-studio-modes span {
        color: #ffe5f9;
        font-size: 15px;
        font-weight: 900;
        text-transform: uppercase;
      }

      .vivy-studio-modes small {
        color: #d9bfd2;
        font-size: 13px;
        line-height: 1.35;
      }

      .vivy-studio-form,
      .vivy-studio-brief {
        min-width: 0;
        border: 1px solid rgba(240, 121, 216, 0.24);
        background: rgba(5, 3, 10, 0.62);
        padding: 16px;
      }

      .vivy-studio-form {
        display: grid;
        gap: 12px;
      }

      .vivy-studio-form [data-vivy-panel] {
        display: grid;
        gap: 12px;
      }

      .vivy-studio-form [data-vivy-panel][hidden] {
        display: none;
      }

      .vivy-studio-form h3,
      .vivy-studio-brief h3 {
        margin-bottom: 4px;
        font-size: 20px;
      }

      .vivy-studio-form label {
        display: grid;
        gap: 7px;
        color: #f2cfe8;
        font-size: 12px;
        font-weight: 850;
        text-transform: uppercase;
      }

      .vivy-studio input,
      .vivy-studio select,
      .vivy-studio textarea {
        width: 100%;
        min-width: 0;
        border: 1px solid rgba(240, 121, 216, 0.28);
        border-radius: 8px;
        background: rgba(2, 1, 5, 0.72);
        color: #fff3fc;
        padding: 11px 12px;
        font-size: 14px;
        line-height: 1.4;
        outline: none;
      }

      .vivy-studio textarea {
        resize: vertical;
      }

      .vivy-studio input:focus,
      .vivy-studio select:focus,
      .vivy-studio textarea:focus {
        border-color: rgba(240, 121, 216, 0.78);
        box-shadow: 0 0 0 3px rgba(240, 121, 216, 0.12);
      }

      .vivy-studio-actions,
      .vivy-studio-brief div {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .vivy-studio-actions button:first-child,
      .vivy-studio-head > button {
        background: linear-gradient(135deg, #f079d8, #8f3eff);
        color: #120516;
        border-color: transparent;
      }

      .vivy-studio-brief {
        display: grid;
        grid-template-rows: auto minmax(260px, 1fr) auto auto auto;
        gap: 12px;
      }

      .vivy-studio-brief pre {
        min-height: 260px;
        max-height: 520px;
        margin: 0;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
        border: 1px solid rgba(240, 121, 216, 0.18);
        background: rgba(1, 1, 5, 0.64);
        color: #f9dff2;
        padding: 14px;
        font-size: 12px;
        line-height: 1.5;
      }

      .vivy-studio-status {
        min-height: 19px;
        margin: 0;
        color: #ffd2f4;
        font-size: 13px;
        line-height: 1.45;
      }

      .vivy-studio-media {
        margin: 0;
        display: grid;
        gap: 10px;
        border: 1px solid rgba(240, 121, 216, 0.28);
        background: rgba(1, 1, 5, 0.7);
        padding: 12px;
      }

      .vivy-studio-media.is-hidden {
        display: none;
      }

      .vivy-studio-media strong {
        color: #ffd2f4;
        font-size: 13px;
        text-transform: uppercase;
      }

      .vivy-studio-media audio,
      .vivy-studio-media video {
        width: 100%;
        display: block;
        border-radius: 8px;
        background: #05030a;
      }

      .vivy-studio-media video {
        max-height: 320px;
      }

      .vivy-studio-media a {
        color: #ffd2f4;
        font-size: 13px;
        font-weight: 800;
      }

      @media (max-width: 900px) {
        .vivy-top {
          align-items: flex-start;
          flex-direction: column;
          gap: 10px;
        }

        .vivy-top div {
          justify-content: flex-start;
        }

        .vivy-poster-stage {
          min-height: auto;
          display: block;
          padding: 10px 12px 18px;
          overflow-x: hidden;
          overflow-y: visible;
        }

        .vivy-poster-frame {
          width: 100%;
          min-width: 0;
          max-width: none;
        }

        .vivy-poster-frame img {
          width: 100%;
          max-width: 100%;
          height: auto;
        }

        .vivy-poster-hotspots {
          display: none;
        }

        .vivy-mobile-slices {
          display: grid;
          gap: 12px;
          margin-top: 12px;
        }

        .vivy-mobile-slice {
          width: 100%;
          height: min(64svh, 520px);
          display: block;
          object-fit: cover;
          border: 1px solid rgba(240, 121, 216, 0.3);
          background: #05030a;
          box-shadow: 0 16px 48px rgba(0, 0, 0, 0.42);
        }

        .vivy-mobile-slice--portrait {
          height: min(72svh, 580px);
          object-position: 43% 50%;
        }

        .vivy-mobile-slice--voice {
          object-position: 100% 19%;
        }

        .vivy-mobile-slice--production {
          object-position: 100% 48%;
        }

        .vivy-mobile-slice--scene {
          object-position: 100% 77%;
        }

        .vivy-studio {
          width: calc(100% - 24px);
          margin-bottom: 30px;
          padding: 14px;
        }

        .vivy-chat {
          width: calc(100% - 24px);
          padding: 14px;
        }

        .vivy-chat-head {
          display: grid;
          align-items: start;
        }

        .vivy-chat-head button {
          width: 100%;
        }

        .vivy-chat-log {
          max-height: 58svh;
        }

        .vivy-chat-message {
          width: 100%;
        }

        .vivy-chat-compose {
          grid-template-columns: 1fr;
        }

        .vivy-chat-compose div {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          min-width: 0;
        }

        .vivy-studio-head {
          display: grid;
          align-items: start;
        }

        .vivy-studio-head > button {
          width: 100%;
        }

        .vivy-studio-grid {
          grid-template-columns: 1fr;
        }

        .vivy-studio-modes {
          grid-template-columns: 1fr;
        }

        .vivy-studio-modes button {
          min-height: auto;
        }

        .vivy-studio-actions {
          display: grid;
          grid-template-columns: 1fr;
        }

        .vivy-studio-brief {
          grid-template-rows: auto auto auto auto auto;
        }

        .vivy-studio-brief pre {
          max-height: 360px;
        }
      }

      @media (max-width: 480px) {
        .vivy-top {
          padding: 10px 12px;
        }

        .vivy-top div {
          gap: 8px;
        }

        .vivy-top a {
          min-height: 34px;
          padding: 0 10px;
          font-size: 11px;
        }

        .vivy-poster-frame img {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="vivy-poster-page">
      <nav class="vivy-top" aria-label="Navigation Vivy">
        <strong>Vivy</strong>
        <div>
          <a href="/vivy/">Vivy</a>
          <a href="#vivy-studio">Studio</a>
          <a href="https://funesterie.me/cockpit/">Cockpit</a>
          <a href="https://k44.funesterie.me/">Kaen44</a>
          <a href="https://a11.funesterie.me/login">A11</a>
        </div>
      </nav>
      <section class="vivy-poster-stage" aria-label="Vivy présence musicale" tabindex="0">
        <div class="vivy-poster-frame">
          <img src="/vivy-presence-musicale.png" alt="Vivy, présence musicale Funesterie: voix, musique, création et partage." />
          <div class="vivy-poster-hotspots" aria-label="Accès rapides Vivy">
            <button type="button" data-vivy-jump="voice" aria-label="Ouvrir création voix"></button>
            <button type="button" data-vivy-jump="song" aria-label="Ouvrir Composition production"></button>
            <button type="button" data-vivy-jump="share" aria-label="Ouvrir scène partage"></button>
          </div>
        </div>
        <div class="vivy-mobile-slices" aria-hidden="true">
          <img class="vivy-mobile-slice vivy-mobile-slice--portrait" src="/vivy-presence-musicale.png" alt="" />
          <img class="vivy-mobile-slice vivy-mobile-slice--voice" src="/vivy-presence-musicale.png" alt="" />
          <img class="vivy-mobile-slice vivy-mobile-slice--production" src="/vivy-presence-musicale.png" alt="" />
          <img class="vivy-mobile-slice vivy-mobile-slice--scene" src="/vivy-presence-musicale.png" alt="" />
        </div>
      </section>
      <section class="vivy-chat" aria-label="Chat Vivy" data-vivy-chat>
        <div class="vivy-chat-head">
          <div>
            <h2>Parler à Vivy</h2>
            <p>Voix, chanson, ambiance ou scène: Vivy transforme l'idée en direction exploitable.</p>
          </div>
          <button type="button" data-vivy-chat-reset>Reset</button>
        </div>
        <div class="vivy-chat-log" aria-live="polite" data-vivy-chat-log></div>
        <form class="vivy-chat-compose" data-vivy-chat-form>
          <textarea name="message" rows="3" placeholder="Ex: fais-moi une chanson sombre mais douce sur Nossen."></textarea>
          <div>
            <button type="button" data-vivy-chat-prompt="Prépare une voix Vivy douce, proche micro, avec une phrase test.">Voix</button>
            <button type="button" data-vivy-chat-prompt="Transforme cette idée en chanson Vivy avec structure et refrain.">Chanson</button>
            <button type="button" data-vivy-chat-prompt="Prépare une scène courte pour publier Vivy en clip vertical.">Scène</button>
            <button type="button" data-vivy-chat-file-button>Fichier</button>
            <button type="submit">Envoyer</button>
          </div>
        </form>
        <div class="vivy-chat-attachments" data-vivy-chat-attachments></div>
        <div class="vivy-chat-reference" data-vivy-chat-reference>
          <span data-vivy-chat-reference-label>Réf voix privée attendue</span>
          <button type="button" data-vivy-chat-reference-button>Audio</button>
        </div>
        <input type="file" accept="audio/*,.wav,.mp3,.webm,.m4a,.ogg" hidden data-vivy-chat-reference-file />
        <input type="file" accept="audio/*,image/*,video/*,text/*,.txt,.md,.json,.csv,.srt,.vtt,.pdf" multiple hidden data-vivy-chat-file />
        <p class="vivy-chat-status" data-vivy-chat-status></p>
      </section>
      <section id="vivy-studio" class="vivy-studio" aria-label="Studio Vivy">
        <div class="vivy-studio-head">
          <div>
            <h2>Studio Vivy</h2>
            <p>Voix, chanson, clip et partage prêts depuis les trois blocs de droite.</p>
          </div>
          <button type="button" data-vivy-share>Partager le brief</button>
        </div>

        <div class="vivy-studio-grid">
          <div class="vivy-studio-modes" role="tablist" aria-label="Modules Vivy">
            <button type="button" class="is-active" data-vivy-mode="voice" role="tab" aria-selected="true">
              <span>Création voix</span>
              <small>Calibrer une voix, préparer Voicemod/RVC/A11 Voice et garder la référence propre.</small>
            </button>
            <button type="button" data-vivy-mode="song" role="tab" aria-selected="false">
              <span>Composition - production</span>
              <small>Transformer un thème, texte ou paroles en brief chanson utilisable par Vivy.</small>
            </button>
            <button type="button" data-vivy-mode="share" role="tab" aria-selected="false">
              <span>Scène - partage</span>
              <small>Assembler clip, lien, canal et consignes de publication sans exposer les secrets.</small>
            </button>
          </div>

          <form class="vivy-studio-form" data-vivy-form>
            <h3 data-vivy-form-title>Création voix</h3>

            <div data-vivy-panel="voice">
              <label>
                Outil voix
                <select name="voiceTool">
                  <option>A11 Voice + Voicemod</option>
                  <option>A11 Voice + RVC</option>
                  <option>Audacity + ffmpeg</option>
                  <option>Voicemod live</option>
                </select>
              </label>
              <label>
                Référence audio
                <input name="voiceFile" type="file" accept="audio/*,.wav,.mp3,.m4a,.flac,.ogg" />
              </label>
              <label>
                Instruction voix
                <textarea name="voiceInstruction" rows="6" placeholder="Ex: voix douce, proche micro, légère saturation pop, garder une diction claire."></textarea>
              </label>
            </div>

            <div data-vivy-panel="song" hidden>
              <label>
                Départ
                <select name="songSource">
                  <option>Thème</option>
                  <option>Texte brut</option>
                  <option>Paroles</option>
                  <option>Instruction complète</option>
                </select>
              </label>
              <label>
                Couleur sonore
                <input name="songMood" value="Electro pop dark cinematographique" />
              </label>
              <label>
                Matière créative
                <textarea name="songText" rows="8" placeholder="Thème, paroles, ambiance, intention, histoire ou simple idée."></textarea>
              </label>
            </div>

            <div data-vivy-panel="share" hidden>
              <label>
                Canal
                <select name="shareTarget">
                  <option>YouTube</option>
                  <option>OBS / Live</option>
                  <option>SoundCloud</option>
                  <option>Deezer</option>
                  <option>Lien équipe</option>
                </select>
              </label>
              <label>
                Lien ou cible
                <input name="shareUrl" placeholder="https://..." />
              </label>
              <label>
                Token local
                <input name="shareToken" type="password" placeholder="Non stocké, non copié dans le brief" autocomplete="off" />
              </label>
              <label>
                Instruction publication
                <textarea name="shareInstruction" rows="6" placeholder="Ex: clip vertical 30s, titre court, description FR, tags Funesterie/Vivy."></textarea>
              </label>
            </div>

            <div class="vivy-studio-actions">
              <button type="submit" data-vivy-action>Préparer calibration</button>
              <button type="button" data-vivy-ask>Demander à Vivy</button>
              <button type="button" data-vivy-open="a11">Ouvrir A11</button>
              <button type="button" data-vivy-open="k44">Ouvrir Kaen44</button>
              <button type="button" data-vivy-open="cockpit">Cockpit général</button>
            </div>
          </form>

          <aside class="vivy-studio-brief" aria-live="polite">
            <h3>Brief agents</h3>
            <pre data-vivy-brief></pre>
            <div>
              <button type="button" data-vivy-copy>Copier</button>
              <button type="button" data-vivy-share>Partager</button>
            </div>
            <figure class="vivy-studio-media is-hidden" data-vivy-media></figure>
            <p class="vivy-studio-status" data-vivy-status></p>
          </aside>
        </div>
      </section>
    </main>
    <script>
      (function () {
        var root = document.querySelector("[data-vivy-chat]");
        if (!root) return;
        var log = root.querySelector("[data-vivy-chat-log]");
        var form = root.querySelector("[data-vivy-chat-form]");
        var input = form ? form.querySelector("textarea[name='message']") : null;
        var status = root.querySelector("[data-vivy-chat-status]");
        var reset = root.querySelector("[data-vivy-chat-reset]");
        var refBox = root.querySelector("[data-vivy-chat-reference]");
        var refLabel = root.querySelector("[data-vivy-chat-reference-label]");
        var refButton = root.querySelector("[data-vivy-chat-reference-button]");
        var refFile = root.querySelector("[data-vivy-chat-reference-file]");
        var attachmentsRoot = root.querySelector("[data-vivy-chat-attachments]");
        var fileButton = root.querySelector("[data-vivy-chat-file-button]");
        var fileInput = root.querySelector("[data-vivy-chat-file]");
        var storageKey = "vivy:public-chat:v2";
        var conversationKey = "vivy:conversation-id:static";
        var referenceKey = "vivy:voice-reference:static";
        var conversationId = getConversationId();
        var messages = readMessages();
        var attachedFiles = [];
        var sending = false;
        var awaitingReference = false;

        function unicodeText(value, maxLength) {
          var text = String(value || "")
            .replace(/\r\n/g, "\n")
            .replace(/\u0000/g, "")
            .normalize("NFC")
            .trim();
          return maxLength > 0 ? text.slice(0, maxLength) : text;
        }

        function unicodeLine(value, fallback, maxLength) {
          return unicodeText(value, maxLength || 160).replace(/\s+/g, " ") || (fallback || "");
        }

        function foldLookup(value) {
          return unicodeText(value)
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .replace(/[’']/g, " ")
            .replace(/[-_/]/g, " ")
            .replace(/[^\p{L}\p{N}\s]/gu, " ")
            .replace(/\s+/g, " ")
            .trim()
            .toLocaleLowerCase("fr-FR");
        }

        function greeting() {
          return {
            role: "assistant",
            content: "Je suis Vivy. Parle-moi d'une voix, d'une chanson, d'une ambiance ou d'une scène à publier."
          };
        }

        function readMessages() {
          try {
            var parsed = JSON.parse(localStorage.getItem(storageKey) || "null");
            if (Array.isArray(parsed) && parsed.length) {
              return parsed.slice(-24).filter(function (entry) {
                return entry && entry.content;
              });
            }
          } catch (_) {}
          return [greeting()];
        }

        function saveMessages() {
          try {
            localStorage.setItem(storageKey, JSON.stringify(messages.slice(-24)));
          } catch (_) {}
        }

        function setStatus(text) {
          if (status) status.textContent = text || "";
        }

        function getConversationId() {
          try {
            var existing = localStorage.getItem(conversationKey) || "";
            if (existing) return existing;
            var next = "vivy-" + Date.now() + "-" + Math.random().toString(16).slice(2);
            localStorage.setItem(conversationKey, next);
            return next;
          } catch (_) {
            return "vivy-" + Date.now() + "-" + Math.random().toString(16).slice(2);
          }
        }

        function formatSize(sizeBytes) {
          var size = Number(sizeBytes || 0);
          if (!size || !isFinite(size)) return "";
          if (size < 1024) return size + " o";
          if (size < 1024 * 1024) return Math.round(size / 1024) + " Ko";
          return (size / (1024 * 1024)).toFixed(1) + " Mo";
        }

        function renderAttachments() {
          if (!attachmentsRoot) return;
          attachmentsRoot.innerHTML = "";
          attachedFiles.forEach(function (file, index) {
            var chip = document.createElement("span");
            chip.textContent = file.filename + (file.sizeBytes ? " - " + formatSize(file.sizeBytes) : "");
            var remove = document.createElement("button");
            remove.type = "button";
            remove.textContent = "x";
            remove.setAttribute("aria-label", "Retirer " + file.filename);
            remove.addEventListener("click", function () {
              attachedFiles.splice(index, 1);
              renderAttachments();
            });
            chip.appendChild(remove);
            attachmentsRoot.appendChild(chip);
          });
        }

        function canReadPreview(file) {
          var name = String(file && file.name || "").toLowerCase();
          return file && file.size <= 90000 && (
            String(file.type || "").indexOf("text/") === 0
            || /\.(txt|md|markdown|json|csv|srt|vtt|lyrics?|prompt)$/i.test(name)
          );
        }

        function readTextPreview(file) {
          return new Promise(function (resolve) {
            if (!canReadPreview(file)) return resolve("");
            var reader = new FileReader();
            reader.onerror = function () { resolve(""); };
            reader.onload = function () { resolve(unicodeText(reader.result, 6000)); };
            reader.readAsText(file, "UTF-8");
          });
        }

        function addConversationFiles(fileList) {
          var selected = Array.prototype.slice.call(fileList || []).slice(0, 4);
          if (!selected.length) return;
          setStatus("Vivy ajoute les fichiers au contexte...");
          Promise.all(selected.map(function (file) {
            return readTextPreview(file).then(function (preview) {
              return {
                id: "local-" + Date.now() + "-" + Math.random().toString(16).slice(2),
                filename: unicodeLine(file.name, "fichier", 180),
                contentType: file.type || "application/octet-stream",
                sizeBytes: file.size,
                description: preview ? "Extrait texte lu localement pour Vivy." : "Fichier joint à la conversation Vivy.",
                textPreview: preview,
                uploaded: false
              };
            });
          })).then(function (files) {
            attachedFiles = attachedFiles.concat(files).slice(-6);
            renderAttachments();
            setStatus("Fichiers ajoutés au contexte Vivy");
          });
        }

        function wantsVoiceReference(text) {
          return /\b(voix|voice|timbre|changer|change|modifier|modifie|calibr|reference|ref audio|imiter|clone)\b/i.test(foldLookup(text));
        }

        function getReferenceName() {
          try {
            return localStorage.getItem(referenceKey) || "";
          } catch (_) {
            return "";
          }
        }

        function setReferenceName(name) {
          try {
            localStorage.setItem(referenceKey, name || "");
          } catch (_) {}
        }

        function renderReference(visible) {
          var name = getReferenceName();
          if (!refBox || !refLabel) return;
          refBox.classList.toggle("is-visible", Boolean(visible || name));
          refLabel.textContent = name ? "Réf voix: " + name : "Réf voix privée attendue";
        }

        function render() {
          if (!log) return;
          log.innerHTML = "";
          messages.slice(-24).forEach(function (message) {
            var article = document.createElement("article");
            article.className = "vivy-chat-message" + (message.role === "user" ? " is-user" : "");
            var speaker = document.createElement("span");
            speaker.textContent = message.role === "user" ? "Vous" : "Vivy";
            var body = document.createElement("p");
            body.textContent = message.content || "";
            article.appendChild(speaker);
            article.appendChild(body);
            if (Array.isArray(message.files) && message.files.length) {
              var files = document.createElement("div");
              files.className = "vivy-chat-file-list";
              message.files.forEach(function (file) {
                var chip = document.createElement("span");
                chip.textContent = (file.filename || "fichier") + (file.sizeBytes ? " - " + formatSize(file.sizeBytes) : "");
                files.appendChild(chip);
              });
              article.appendChild(files);
            }
            log.appendChild(article);
          });
          log.scrollTop = log.scrollHeight;
          renderReference(awaitingReference);
          renderAttachments();
        }

        function addMessage(role, content, files) {
          messages.push({ role: role, content: unicodeText(content), files: files || undefined, ts: new Date().toISOString() });
          messages = messages.slice(-24);
          saveMessages();
          render();
        }

        function chatHistory() {
          return messages.slice(-12).map(function (entry) {
            return { role: entry.role, content: entry.content, ts: entry.ts };
          });
        }

        function send(text) {
          text = unicodeText(text);
          var filesForMessage = attachedFiles.slice(0, 6);
          if ((!text && !filesForMessage.length) || sending) return;
          var voiceRequest = wantsVoiceReference(text);
          awaitingReference = voiceRequest;
          addMessage("user", text || "J'ajoute ces fichiers pour Vivy.", filesForMessage);
          attachedFiles = [];
          renderAttachments();
          if (input) input.value = "";
          sending = true;
          setStatus(voiceRequest ? "Vivy attend un audio de référence" : "Vivy écoute et range l'idée...");
          renderReference(voiceRequest);
          fetch("/api/vivy/studio/chat", {
            method: "POST",
            credentials: "include",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              message: text || "J'ajoute ces fichiers pour Vivy.",
              conversationId: conversationId,
              files: filesForMessage,
              history: chatHistory()
            })
          }).then(function (response) {
            return response.json().catch(function () { return {}; }).then(function (payload) {
              if (!response.ok || payload.ok === false) {
                throw new Error(payload.message || payload.error || ("Vivy indisponible (" + response.status + ")"));
              }
              return payload;
            });
          }).then(function (payload) {
            var assistant = String(payload.assistant || payload.content || payload.summary || "").trim()
              || "Je suis là. Donne-moi une ambiance, une phrase ou une direction.";
            if (voiceRequest) {
              assistant += "\n\nPour changer ma voix, envoie-moi un fichier audio court. Je le garde en référence privée pour ton compte.";
            }
            addMessage("assistant", assistant);
            var memoryText = payload.semanticMemory && payload.semanticMemory.stored || payload.memoryStored
              ? "Idée rangée dans la mémoire Vivy"
              : "Vivy prête";
            setStatus(payload.aiMode === "llm" ? memoryText + " - IA active" : memoryText);
          }).catch(function (error) {
            var message = "Je n'arrive pas à joindre le studio Vivy pour l'instant: " + (error && error.message ? error.message : error);
            if (voiceRequest) {
              message += "\n\nPour changer ma voix, envoie-moi un fichier audio court. Je le garde en référence privée pour ton compte.";
            }
            addMessage("assistant", message);
            setStatus("Connexion Vivy à vérifier");
          }).finally(function () {
            sending = false;
          });
        }

        function uploadReference(file) {
          if (!file) return;
          var label = "Vivy - " + unicodeLine(String(file.name || "référence voix").replace(/\.[^.]+$/, ""), "référence voix", 54);
          var body = new FormData();
          body.append("file", file);
          body.append("label", label);
          body.append("visibility", "private");
          setStatus("Vivy garde la référence voix...");
          fetch("/api/tts/references", {
            method: "POST",
            credentials: "include",
            body: body
          }).then(function (response) {
            return response.json().catch(function () { return {}; }).then(function (payload) {
              if (!response.ok || payload.ok === false) {
                throw new Error(payload.message || payload.error || ("upload impossible (" + response.status + ")"));
              }
              return payload;
            });
          }).then(function (payload) {
            var name = payload && payload.reference ? (payload.reference.label || payload.reference.originalName || label) : label;
            setReferenceName(name);
            awaitingReference = false;
            renderReference(true);
            addMessage("assistant", "Référence reçue. Quand tu me demandes cette voix, je m'en sers comme base privée.");
            setStatus("Référence voix privée: " + name);
          }).catch(function (error) {
            renderReference(true);
            setStatus("Audio non ajouté: " + (error && error.message ? error.message : error));
          });
        }

        if (form) {
          form.addEventListener("submit", function (event) {
            event.preventDefault();
            send(input ? input.value : "");
          });
        }
        Array.prototype.forEach.call(root.querySelectorAll("[data-vivy-chat-prompt]"), function (button) {
          button.addEventListener("click", function () {
            send(button.getAttribute("data-vivy-chat-prompt") || "");
          });
        });
        if (reset) {
          reset.addEventListener("click", function () {
            messages = [greeting()];
            saveMessages();
            setStatus("Conversation remise à zéro");
            render();
          });
        }
        if (refButton && refFile) {
          refButton.addEventListener("click", function () { refFile.click(); });
          refFile.addEventListener("change", function () {
            var file = refFile.files && refFile.files[0] ? refFile.files[0] : null;
            refFile.value = "";
            uploadReference(file);
          });
        }
        if (fileButton && fileInput) {
          fileButton.addEventListener("click", function () { fileInput.click(); });
          fileInput.addEventListener("change", function () {
            addConversationFiles(fileInput.files);
            fileInput.value = "";
          });
        }

        render();
      })();

      (function () {
        var root = document.querySelector(".vivy-studio");
        if (!root) return;
        var modes = {
          voice: {
            title: "Création voix",
            label: "Calibrer une voix, préparer Voicemod/RVC/A11 Voice et garder la référence propre.",
            action: "Préparer calibration"
          },
          song: {
            title: "Composition - production",
            label: "Transformer un thème, texte ou paroles en brief chanson utilisable par Vivy.",
            action: "Préparer chanson"
          },
          share: {
            title: "Scène - partage",
            label: "Assembler clip, lien, canal et consignes de publication sans exposer les secrets.",
            action: "Préparer partage"
          }
        };
        var activeMode = "voice";
        var voiceFileName = "";
        var vivyOutput = "";
        var form = root.querySelector("[data-vivy-form]");
        var title = root.querySelector("[data-vivy-form-title]");
        var action = root.querySelector("[data-vivy-action]");
        var briefNode = root.querySelector("[data-vivy-brief]");
        var statusNode = root.querySelector("[data-vivy-status]");
        var mediaNode = root.querySelector("[data-vivy-media]");

        function field(name) {
          return form.elements[name];
        }

        function value(name) {
          var input = field(name);
          return input ? String(input.value || "").trim() : "";
        }

        function setStatus(text) {
          if (statusNode) statusNode.textContent = text || "";
        }

        function firstText() {
          for (var i = 0; i < arguments.length; i += 1) {
            var value = String(arguments[i] || "").trim();
            if (value) return value;
          }
          return "";
        }

        function resolveMediaUrl(url) {
          var value = String(url || "").trim();
          if (!value) return "";
          if (/^(?:https?:)?\/\//i.test(value) || value.indexOf("data:") === 0 || value.indexOf("blob:") === 0) return value;
          if (value.charAt(0) === "/") return value;
          return "/" + value.replace(/^\.?\//, "");
        }

        function setMediaPreview(payload) {
          if (!mediaNode) return;
          while (mediaNode.firstChild) mediaNode.removeChild(mediaNode.firstChild);

          var media = payload && payload.media ? payload.media : {};
          var audioUrl = resolveMediaUrl(firstText(payload && payload.audioUrl, payload && payload.audio_url, media.audioUrl, media.audio_url));
          var videoUrl = resolveMediaUrl(firstText(payload && payload.videoUrl, payload && payload.video_url, media.videoUrl, media.video_url));
          var url = audioUrl || videoUrl || resolveMediaUrl(firstText(media.url, payload && payload.url));

          if (!url) {
            mediaNode.classList.add("is-hidden");
            return;
          }

          var isVideo = Boolean(videoUrl || (media.kind === "video") || /\.mp4(?:[?#].*)?$/i.test(url));
          var title = document.createElement("strong");
          title.textContent = isVideo ? "Clip Vivy prêt" : "Audio Vivy prêt";
          mediaNode.appendChild(title);

          var player = document.createElement(isVideo ? "video" : "audio");
          player.controls = true;
          if (isVideo) {
            player.playsInline = true;
            player.preload = "metadata";
          } else {
            player.preload = "metadata";
          }
          player.src = url;
          mediaNode.appendChild(player);

          var link = document.createElement("a");
          link.href = url;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = isVideo ? "Ouvrir la vidéo" : "Ouvrir l'audio";
          mediaNode.appendChild(link);

          mediaNode.classList.remove("is-hidden");
        }

        function buildProductionPayload() {
          return {
            mode: activeMode,
            voiceTool: value("voiceTool"),
            voiceFileName: voiceFileName,
            voiceReferenceName: voiceFileName,
            voiceInstruction: value("voiceInstruction"),
            songSource: value("songSource"),
            songMood: value("songMood"),
            songText: value("songText"),
            shareTarget: value("shareTarget"),
            shareUrl: value("shareUrl"),
            shareTokenPresent: Boolean(value("shareToken")),
            shareInstruction: value("shareInstruction")
          };
        }

        function runProduction(button) {
          if (button) button.disabled = true;
          setStatus("Vivy produit un fichier exploitable...");
          return fetch("/api/vivy/studio/produce", {
            method: "POST",
            credentials: "include",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(buildProductionPayload())
          }).then(function (response) {
            return response.json().catch(function () { return {}; }).then(function (payload) {
              if (!response.ok || payload.ok === false) {
                throw new Error(payload.message || payload.error || ("Vivy indisponible (" + response.status + ")"));
              }
              return payload;
            });
          }).then(function (payload) {
            vivyOutput = String(payload.assistant || payload.brief || payload.summary || "").trim();
            if (!vivyOutput) throw new Error("reponse_vide");
            setMediaPreview(payload);
            setStatus("Production Vivy prête. Le lecteur est disponible dans le brief.");
            render();
          }).catch(function (error) {
            setMediaPreview(null);
            setStatus("Production Vivy indisponible: " + (error && error.message ? error.message : error));
          }).finally(function () {
            if (button) button.disabled = false;
          });
        }

        function buildBaseBrief() {
          var lines = [
            "VIVY_STUDIO_HANDOFF",
            "Atelier: " + modes[activeMode].title,
            "Objectif: " + modes[activeMode].label,
            ""
          ];

          if (activeMode === "voice") {
            lines.push(
              "Flux voix:",
              "- Outil cible: " + value("voiceTool"),
              "- Référence audio: " + (voiceFileName || "à fournir"),
              "- Instruction: " + (value("voiceInstruction") || "définir le timbre, les limites et le style de modulation"),
              "- Sortie attendue: profil vocal, notes de calibration, chaîne d'effets et phrase de test.",
              "- Sécurité: ne pas publier la référence brute sans accord."
            );
          }

          if (activeMode === "song") {
            lines.push(
              "Flux chanson:",
              "- Source: " + value("songSource"),
              "- Direction sonore: " + (value("songMood") || "Electro pop dark cinematographique"),
              "- Matière: " + (value("songText") || "thème libre à développer"),
              "- Sortie attendue: titre, intention, structure couplet/refrain, paroles, arrangement, voix guide et assets à produire.",
              "- Rôle: Vivy crée la chanson, A11 aide pour image/vidéo si nécessaire."
            );
          }

          if (activeMode === "share") {
            lines.push(
              "Flux scène / partage:",
              "- Canal: " + value("shareTarget"),
              "- Lien: " + (value("shareUrl") || "à fournir"),
              "- Token fourni dans l'interface: " + (value("shareToken") ? "oui, local seulement" : "non"),
              "- Instruction: " + (value("shareInstruction") || "préparer clip, titre, description et checklist publication"),
              "- Sortie attendue: clip/short, titre, description, tags, miniature, checklist OBS ou upload.",
              "- Règle token: ne jamais coller le token dans un chat public; utiliser OAuth ou coffre local."
            );
          }

          lines.push(
            "",
            "Routage recommandé:",
            "- Vivy: voix, paroles, composition, présence audio.",
            "- A11: image, vidéo, montage, génération d'assets.",
            "- Kaen44: interface client, fichiers, suivi et partage avec les personnes qui bossent dessus."
          );
          return lines.join("\n");
        }

        function buildBrief() {
          var base = buildBaseBrief();
          return vivyOutput ? base + "\n\nVIVY_PRODUCTION\n" + vivyOutput : base;
        }

        function render() {
          Array.prototype.forEach.call(root.querySelectorAll("[data-vivy-mode]"), function (button) {
            var isActive = button.getAttribute("data-vivy-mode") === activeMode;
            button.classList.toggle("is-active", isActive);
            button.setAttribute("aria-selected", isActive ? "true" : "false");
          });
          Array.prototype.forEach.call(root.querySelectorAll("[data-vivy-panel]"), function (panel) {
            panel.hidden = panel.getAttribute("data-vivy-panel") !== activeMode;
          });
          if (title) title.textContent = modes[activeMode].title;
          if (action) action.textContent = modes[activeMode].action;
          if (briefNode) briefNode.textContent = buildBrief();
        }

        function copyBrief(message) {
          var text = buildBrief();
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(function () {
              setStatus(message || "Brief copié pour les agents.");
            }).catch(function () {
              setStatus("Copie auto indisponible: sélectionne le brief et copie-le.");
            });
          } else {
            setStatus("Copie auto indisponible: sélectionne le brief et copie-le.");
          }
        }

        Array.prototype.forEach.call(root.querySelectorAll("[data-vivy-mode]"), function (button) {
          button.addEventListener("click", function () {
            activeMode = button.getAttribute("data-vivy-mode") || "voice";
            setStatus("");
            render();
          });
        });

        Array.prototype.forEach.call(document.querySelectorAll("[data-vivy-jump]"), function (button) {
          button.addEventListener("click", function () {
            var targetMode = button.getAttribute("data-vivy-jump") || "voice";
            if (modes[targetMode]) activeMode = targetMode;
            setStatus("");
            render();
            root.scrollIntoView({ behavior: "smooth", block: "start" });
          });
        });

        form.addEventListener("input", render);
        form.addEventListener("change", function (event) {
          if (event.target && event.target.name === "voiceFile") {
            voiceFileName = event.target.files && event.target.files[0] ? event.target.files[0].name : "";
          }
          render();
        });
        form.addEventListener("submit", function (event) {
          event.preventDefault();
          runProduction(action);
        });

        Array.prototype.forEach.call(root.querySelectorAll("[data-vivy-copy]"), function (button) {
          button.addEventListener("click", function () { copyBrief(); });
        });

        Array.prototype.forEach.call(root.querySelectorAll("[data-vivy-share]"), function (button) {
          button.addEventListener("click", function () {
            var text = buildBrief();
            if (navigator.share) {
              navigator.share({ title: "Vivy - " + modes[activeMode].title, text: text }).then(function () {
                setStatus("Partage système ouvert.");
              }).catch(function () {
                copyBrief("Brief prêt à coller dans l'équipe.");
              });
            } else {
              copyBrief("Brief prêt à coller dans l'équipe.");
            }
          });
        });

        Array.prototype.forEach.call(root.querySelectorAll("[data-vivy-open]"), function (button) {
          button.addEventListener("click", function () {
            var target = button.getAttribute("data-vivy-open");
            var labels = {
              a11: "Brief copié. Ouverture A11...",
              k44: "Brief copié. Ouverture Kaen44...",
              cockpit: "Brief copié. Ouverture du cockpit général..."
            };
            var urls = {
              a11: "https://a11.funesterie.me/login",
              k44: "https://k44.funesterie.me/cockpit",
              cockpit: "https://funesterie.me/cockpit/"
            };
            copyBrief(labels[target] || "Brief copié.");
            window.open(urls[target] || urls.cockpit, "_blank", "noopener,noreferrer");
          });
        });

        Array.prototype.forEach.call(root.querySelectorAll("[data-vivy-ask]"), function (button) {
          button.addEventListener("click", function () {
            runProduction(button);
          });
        });

        render();
      })();
    </script>
  </body>
</html>
