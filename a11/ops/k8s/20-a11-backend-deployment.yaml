apiVersion: apps/v1
kind: Deployment
metadata:
  name: a11-backend
  namespace: funesterie
  labels:
    app: a11-backend
    app.kubernetes.io/part-of: funesterie
spec:
  replicas: 1
  selector:
    matchLabels:
      app: a11-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: a11-backend
    spec:
      containers:
        - name: a11-backend
          # Set to your pushed image, e.g. registry/funesterie/a11-backend:<tag>.
          # See a11/backend/apps/server/DOCKER_HUB_PUSH.md.
          image: REGISTRY/a11-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: a11-backend-config
            - secretRef:
                name: a11-backend-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          volumeMounts:
            - name: runtime
              mountPath: /app/runtime
      volumes:
        - name: runtime
          persistentVolumeClaim:
            claimName: a11-backend-runtime
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: a11-backend-runtime
  namespace: funesterie
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
