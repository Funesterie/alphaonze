<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOSSEN — Clips musicaux</title>
<style>
:root{--bg:#08080f;--card:#111119;--border:rgba(255,255,255,.05);--accent:#7b2ff7;--cyan:#00f5d4;--pink:#f72585;--gold:#fbbf24;--text:#eee;--muted:#777}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,system-ui,sans-serif}
.app{max-width:420px;margin:0 auto;padding:.6rem}
h1{text-align:center;font-size:1.6rem;font-weight:900;background:linear-gradient(135deg,var(--cyan),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;padding:.6rem 0 .2rem}
.status{text-align:center;font-size:.65rem;color:var(--muted);margin-bottom:.4rem}
.user-badge{text-align:center;font-size:.6rem;color:var(--cyan);margin-bottom:.6rem}
nav{display:flex;justify-content:center;gap:.3rem;margin-bottom:.8rem}
nav a{color:var(--muted);font-size:.65rem;text-decoration:none;padding:.2rem .5rem;border-radius:4px}
nav a:hover{color:var(--cyan)}
.card{background:var(--card);border-radius:10px;padding:.8rem;margin-bottom:.6rem}
.card h2{font-size:.85rem;margin-bottom:.5rem;display:flex;align-items:center;gap:.4rem}
.btn{padding:.4rem .8rem;border:none;border-radius:6px;font-size:.75rem;font-weight:600;cursor:pointer;transition:opacity .2s}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-clip{background:linear-gradient(135deg,var(--accent),var(--pink));color:#fff}
.btn-full{background:linear-gradient(135deg,var(--gold),#f59e0b);color:#111;font-weight:800}
.btn-full.locked{opacity:.3;cursor:not-allowed}
select,.input-url{width:100%;padding:.4rem;margin:.2rem 0;background:#0a0a12;border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:.78rem}
.input-url::placeholder{color:var(--muted)}
.or{text-align:center;font-size:.6rem;color:var(--muted);margin:.2rem 0}
.file-label{display:inline-flex;align-items:center;gap:.3rem;padding:.35rem .6rem;border-radius:6px;font-size:.7rem;cursor:pointer;background:rgba(255,255,255,.04);border:1px dashed rgba(255,255,255,.15);color:var(--muted);transition:border-color .2s;width:100%}
.file-label:hover{border-color:var(--cyan);color:var(--cyan)}
.file-input{display:none}
.file-name{font-size:.6rem;color:var(--cyan);margin-top:.2rem;word-break:break-all}
.bar{height:3px;background:rgba(255,255,255,.03);border-radius:2px;margin:.4rem 0;display:none}
.bar.on{display:block}
.bar div{height:100%;background:var(--cyan);border-radius:2px;transition:width .3s}
.msg{font-size:.65rem;color:var(--muted);min-height:1em;margin-top:.3rem}
.produce-row{display:flex;gap:.4rem;margin-top:.5rem;flex-wrap:wrap;align-items:center}
.produce-info{font-size:.55rem;color:var(--muted);margin-top:.3rem;line-height:1.4}
.songs{max-height:320px;overflow-y:auto}
.s{display:flex;align-items:center;padding:.4rem 0;border-bottom:1px solid rgba(255,255,255,.03);gap:.4rem}
.s .play{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:.65rem;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:background .15s}
.s .play:hover{background:var(--pink)}
.s .play.active{background:var(--cyan);color:#000}
.s .info{flex:1;overflow:hidden}
.s .title{font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.s .meta{font-size:.6rem;color:var(--muted)}
.s .use{font-size:.6rem;color:var(--accent);cursor:pointer;padding:.2rem .4rem;border-radius:3px;background:rgba(123,47,247,.1);border:none;font-weight:600}
.s .use:hover{background:rgba(123,47,247,.2)}
.player{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--border);padding:.5rem;display:none;flex-direction:column;gap:.3rem;border-radius:10px 10px 0 0}
.player.on{display:flex}
.player .now{font-size:.72rem;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.player audio{width:100%;height:32px}
.clips{max-height:200px;overflow-y:auto}
.clips .c{padding:.3rem 0;border-bottom:1px solid rgba(255,255,255,.03)}
.clips .c a{color:var(--cyan);font-size:.75rem;text-decoration:none}
.badge{font-size:.55rem;padding:.1rem .3rem;border-radius:3px;font-weight:700;text-transform:uppercase}
.badge-gold{background:rgba(251,191,36,.15);color:var(--gold);border:1px solid rgba(251,191,36,.3)}
.empty{color:var(--muted);font-size:.7rem;text-align:center;padding:1rem}
</style>
</head>
<body>
<div class="app">
<h1>NOSSEN</h1>
<div class="status" id="st">...</div>
<div class="user-badge" id="user-badge"></div>
<nav>
  <a href="https://vivy.funesterie.me">Vivy</a>
  <a href="https://a11.funesterie.me">A11</a>
  <a href="https://k44.funesterie.me">K44</a>
  <a href="https://funesterie.me">Accueil</a>
</nav>

<div class="card">
  <h2>🎬 Produire un clip</h2>
  <select id="song"><option value="">Choisir une chanson ou importer…</option></select>

  <div class="or">— ou importer ta musique —</div>
  <input class="input-url" type="url" id="import-url" placeholder="Colle un lien audio (mp3, m4a…)">
  <label class="file-label" id="file-label">
    📁 Glisse ou choisis un fichier audio
    <input class="file-input" type="file" id="import-file" accept="audio/*">
  </label>
  <div class="file-name" id="file-name"></div>

  <select id="vibe">
    <option value="auto">🤖 Mode libre (l'IA décide)</option>
    <option value="live">🎤 Concert live</option>
    <option value="cyberpunk">🌃 Cyberpunk</option>
    <option value="cosmic">🌌 Cosmique</option>
    <option value="intimate">🎹 Intimiste</option>
  </select>
  <div class="produce-row">
    <button class="btn btn-clip" id="go-clip">Clip</button>
    <button class="btn btn-full" id="go-full">Full Clip ✨</button>
  </div>
  <div class="produce-info">
    Clip = images sur la musique (gratuit) · Full Clip = vidéo complète générée (réservé admin)<br>
    Mode libre : l'IA analyse les paroles et choisit le thème.
  </div>
  <div class="bar" id="bar"><div id="fill" style="width:0%"></div></div>
  <div class="msg" id="msg"></div>
</div>

<div class="card">
  <h2>🎤 Mes chansons <span class="badge badge-gold" id="song-count">0</span></h2>
  <div id="list" class="songs"></div>
</div>

<div class="card">
  <h2>📁 Clips produits</h2>
  <div id="clips" class="clips"></div>
</div>
</div>

<div class="player" id="player">
  <div class="now" id="now-playing"></div>
  <audio id="audio" controls></audio>
</div>

<script>
(function() {
  "use strict";
  var A = location.origin;
  var songs = [];
  var currentIdx = null;
  var pollTimer = null;
  var userEmail = null;
  var isAdmin = false;
  var ADMIN_EMAILS = ["cellaurojeffrey@gmail.com"];
  var importedFile = null;

  var SC = {
    live: [{n:"Ouverture",v:"Wide concert arena lights fog lasers crowd anticipation blue purple"},{n:"Voix",v:"Female singer long purple-cyan hair microphone golden spotlight emotional white violet outfit"},{n:"Climax",v:"Stage erupts holographics singer arms spread crowd hands confetti energy"},{n:"Pont",v:"Singer alone blue light eyes closed crowd phone lights stars emotional"},{n:"Final",v:"Full stage fireworks singer triumphant arms raised holographic wings purple gold"},{n:"Fermeture",v:"Singer bows confetti smile wave lights dim single spotlight camera back"}],
    cyberpunk: [{n:"Ville",v:"Aerial cyberpunk city night neon rain holographic ads"},{n:"Code",v:"Programmer holographic workstation blue light circuit hoodie"},{n:"Portail",v:"Woman materializing data purple-cyan hair particles"},{n:"Énergie",v:"Energy rings pulsing constellation patterns sky"},{n:"Duo",v:"Two figures rooftop light bridge between city below"},{n:"Aube",v:"Dawn skyscraper edge golden light cyan hair morning"}],
    cosmic: [{n:"Vide",v:"Dark space nebulae figure floating energy gathering"},{n:"Anneaux",v:"Concentric rings pulsing geometric patterns purple gold"},{n:"Sphère",v:"Light streams converging sphere pure energy rotation"},{n:"Explosion",v:"Sphere burst new constellations across sky"},{n:"Paix",v:"Figures floating star field connected light serene"},{n:"Braise",v:"Ember light pulsing darkness breathing alive"}],
    intimate: [{n:"Studio",v:"Recording studio microphone amber light vinyl wall"},{n:"Piano",v:"Piano keys close-up notes golden particles"},{n:"Voix",v:"Singer eyes closed studio mic headphones warm"},{n:"Pluie",v:"Rain window city lights contemplative"},{n:"Guitare",v:"Guitar strummed close-up warm wood"},{n:"Silence",v:"Lights dimming empty studio instruments resting"}]
  };

  function api(p, b) {
    var opts = b ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(b), credentials: "include" } : { credentials: "include" };
    return fetch(A + p, opts).then(function(r) { return r.json(); });
  }

  function truncate(str, max) {
    if (!str) return "";
    return str.length > max ? str.slice(0, max) + "\u2026" : str;
  }

  function play(i) {
    var s = songs[i];
    if (!s) return;
    var audio = document.getElementById("audio");
    audio.src = s.playUrl;
    audio.play();
    document.getElementById("player").classList.add("on");
    document.getElementById("now-playing").textContent = s.title;
    currentIdx = i;
    document.querySelectorAll(".s .play").forEach(function(btn, idx) {
      btn.classList.toggle("active", idx === i);
      btn.textContent = idx === i ? "\u23F8" : "\u25B6";
    });
  }

  function pick(i) {
    document.getElementById("song").value = i;
    importedFile = null;
    document.getElementById("import-url").value = "";
    document.getElementById("file-name").textContent = "";
  }

  function checkAuth() {
    return api("/api/auth/me").then(function(d) {
      if (d && d.authenticated && d.user) {
        userEmail = d.user.email || d.user.displayName || null;
        isAdmin = ADMIN_EMAILS.indexOf((userEmail || "").toLowerCase()) !== -1;
        document.getElementById("user-badge").textContent = "\uD83D\uDD13 " + (userEmail || "Connecté");
      } else {
        userEmail = null;
        isAdmin = false;
        document.getElementById("user-badge").innerHTML = '<a href="/login" style="color:var(--muted);text-decoration:underline;font-size:.6rem">Se connecter pour accéder aux clips</a>';
      }
      updateFullClipButton();
    }).catch(function() {
      document.getElementById("user-badge").innerHTML = '<a href="/login" style="color:var(--muted);text-decoration:underline;font-size:.6rem">Se connecter</a>';
      updateFullClipButton();
    });
  }

  function updateFullClipButton() {
    var btn = document.getElementById("go-full");
    if (isAdmin) {
      btn.classList.remove("locked");
      btn.disabled = false;
      btn.title = "Full Clip — vidéo générée sur toute la durée de la chanson";
    } else {
      btn.classList.add("locked");
      btn.disabled = true;
      btn.title = "Bientôt disponible (5 \u20AC) — réservé admin pour l'instant";
    }
  }

  function getSelectedAudioSource() {
    var urlInput = document.getElementById("import-url").value.trim();
    if (urlInput && (urlInput.startsWith("http://") || urlInput.startsWith("https://"))) {
      return { type: "url", url: urlInput, title: "Import" };
    }
    if (importedFile) {
      return { type: "file", file: importedFile, title: importedFile.name.replace(/\.[^.]+$/, "") };
    }
    var i = document.getElementById("song").value;
    if (i !== "") {
      var s = songs[parseInt(i, 10)];
      if (s) return { type: "song", url: s.audioUrl || s.playUrl, title: s.title };
    }
    return null;
  }

  function uploadFile(file) {
    var formData = new FormData();
    formData.append("file", file);
    return fetch(A + "/api/mcp-bridge/upload-audio", {
      method: "POST",
      body: formData,
      credentials: "include"
    }).then(function(r) { return r.json(); }).then(function(d) {
      if (d.ok && d.url) return d.url;
      throw new Error(d.error || "Échec de l'envoi");
    });
  }

  function buildStylePrompt(vibe, title) {
    if (vibe === "auto") {
      return "Cinematic anime style inspired by the song. Analyze the mood of: " + (title || "music") + ". Choose colors, lighting and camera movement that match the emotion. Rich detail, volumetric lighting.";
    }
    if (vibe === "live") return "Professional anime live concert, singer with long purple-cyan hair white violet outfit dramatic lighting";
    if (vibe === "cyberpunk") return "Cinematic anime cyberpunk style neon city volumetric lighting rich detail";
    if (vibe === "cosmic") return "Cinematic anime cosmic space style nebulae energy volumetric lighting";
    return "Cinematic anime intimate studio style warm amber lighting rich detail";
  }

  function buildAutoSections(title) {
    // Mode libre : on génère des sections basées sur le titre
    var t = (title || "musique").toLowerCase();
    var mood = "energetic";
    if (/triste|sombre|nuit|pluie|mélanc|alone|sad/.test(t)) mood = "melancholic";
    if (/cosmic|espace|star|galaxy|univers/.test(t)) mood = "cosmic";
    if (/amour|love|coeur|heart|doux/.test(t)) mood = "romantic";
    if (/rage|fight|combat|war|colère/.test(t)) mood = "intense";
    if (/libre|free|vent|wind|road|route/.test(t)) mood = "freedom";

    var moodSections = {
      energetic: [
        {n:"Intro", v:"Neon city rooftop night, figure silhouette against skyline, energy building"},
        {n:"Build", v:"Fast motion through digital corridors, data streams, bass drop anticipation"},
        {n:"Peak", v:"Explosion of color and light, dancer mid-air, holographic particles everywhere"},
        {n:"Bridge", v:"Slow motion close-up, sweat drops catching neon light, determination"},
        {n:"Climax", v:"Full arena crowd hands up, stage erupts with lasers and confetti"},
        {n:"Outro", v:"Calm after storm, single spotlight fading, city lights below"}
      ],
      melancholic: [
        {n:"Intro", v:"Rain on window, city lights blurred, contemplative figure alone"},
        {n:"Verse", v:"Empty streets at night, puddle reflections, slow walking"},
        {n:"Memory", v:"Warm golden flashback, laughter frozen in time, fading photos"},
        {n:"Bridge", v:"Hands reaching through mist, almost touching, dissolving"},
        {n:"Resolve", v:"Dawn breaking through clouds, first light on face, acceptance"},
        {n:"Outro", v:"Walking away into morning fog, peaceful, forward"}
      ],
      cosmic: [
        {n:"Void", v:"Deep space nebulae, figure floating weightless, energy gathering"},
        {n:"Birth", v:"Stars forming from dust, cosmic dance, creation"},
        {n:"Flight", v:"Racing through asteroid field, light trail behind, speed"},
        {n:"Peak", v:"Supernova explosion, rings of energy expanding, awe"},
        {n:"Peace", v:"Floating among new constellations, serene, connected"},
        {n:"Return", v:"Earth rising on horizon, gentle descent, home"}
      ],
      romantic: [
        {n:"Meet", v:"Two silhouettes in golden hour, cherry blossoms falling"},
        {n:"Dance", v:"Slow dance under string lights, intimate, warm"},
        {n:"Together", v:"Hands intertwined walking pier at sunset, ocean reflecting"},
        {n:"Apart", v:"Train pulling away, figure on platform, longing gaze"},
        {n:"Dream", v:"Fantasy sequence, dancing in clouds, ethereal"},
        {n:"Forever", v:"Reunion embrace, fireworks in sky, joy"}
      ],
      intense: [
        {n:"Tension", v:"Dark corridor, flickering lights, heartbeat rhythm"},
        {n:"Clash", v:"Lightning strikes, figures facing off, energy crackling"},
        {n:"Battle", v:"Fast choreographed combat, sparks flying, determination"},
        {n:"Fall", v:"Slow motion impact, dust rising, silence"},
        {n:"Rise", v:"Standing up from debris, glowing eyes, power surge"},
        {n:"Victory", v:"Triumphant stance on peak, storm clearing, golden light"}
      ],
      freedom: [
        {n:"Start", v:"Engine revving, desert highway, heat shimmer on horizon"},
        {n:"Speed", v:"Racing through open landscape, wind in hair, exhilaration"},
        {n:"Vista", v:"Cliff edge panorama, arms spread, vast world below"},
        {n:"Flight", v:"Leap into sky, gravity defied, clouds rushing past"},
        {n:"Peace", v:"Floating above it all, sunset colors, absolute calm"},
        {n:"Beyond", v:"New horizon ahead, infinite possibility, dawn"}
      ]
    };

    return (moodSections[mood] || moodSections.energetic).map(function(x) {
      return { name: x.n, visual: x.v, duration: 15 };
    });
  }

  function startClip(mode) {
    var source = getSelectedAudioSource();
    if (!source) {
      document.getElementById("msg").textContent = "Choisis une chanson ou importe un fichier audio";
      return;
    }

    if (mode === "full" && !isAdmin) {
      document.getElementById("msg").textContent = "Full Clip réservé — bientôt disponible (5 \u20AC)";
      return;
    }

    var goClip = document.getElementById("go-clip");
    var goFull = document.getElementById("go-full");
    goClip.disabled = true;
    goFull.disabled = true;
    var label = mode === "full" ? "Full Clip" : "Clip";
    document.getElementById("msg").textContent = "\u23F3 Lancement " + label + "…";
    document.getElementById("bar").classList.add("on");
    document.getElementById("fill").style.width = "5%";

    var vibe = document.getElementById("vibe").value;
    var stylePrompt = buildStylePrompt(vibe, source.title);
    var sections;
    if (vibe === "auto") {
      sections = buildAutoSections(source.title);
    } else {
      sections = (SC[vibe] || SC.live).map(function(x) {
        return { name: x.n, visual: x.v, duration: mode === "full" ? 30 : 15 };
      });
    }

    function doCall(audioUrl) {
      var payload = {
        songUrl: audioUrl,
        title: truncate(source.title, 25),
        mode: mode === "full" ? "full-video" : "video",
        style: stylePrompt,
        sections: sections
      };

      api("/api/mcp-bridge/clip/start", payload).then(function(d) {
        if (d.ok) {
          document.getElementById("msg").textContent = label + " en cours…";
          pollJob(d.jobId, mode);
        } else {
          document.getElementById("msg").textContent = "\u274C " + (d.error || "Erreur inconnue");
          goClip.disabled = false;
          updateFullClipButton();
        }
      }).catch(function(e) {
        document.getElementById("msg").textContent = "\u274C " + e.message;
        goClip.disabled = false;
        updateFullClipButton();
      });
    }

    if (source.type === "file") {
      document.getElementById("msg").textContent = "\u23F3 Envoi du fichier…";
      uploadFile(source.file).then(function(url) {
        document.getElementById("msg").textContent = "\u23F3 Fichier envoyé, lancement…";
        doCall(url);
      }).catch(function(e) {
        document.getElementById("msg").textContent = "\u274C Envoi : " + e.message;
        goClip.disabled = false;
        updateFullClipButton();
      });
    } else {
      doCall(source.url);
    }
  }

  function pollJob(id, mode) {
    var label = mode === "full" ? "Full Clip" : "Clip";
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(function() {
      api("/api/mcp-bridge/clip/status/" + id).then(function(d) {
        var progress = d.progress || 0;
        document.getElementById("fill").style.width = progress + "%";
        document.getElementById("msg").textContent = label + " : " + (d.status || "…") + " " + progress + "%";
        if (d.status === "done") {
          clearInterval(pollTimer);
          document.getElementById("fill").style.width = "100%";
          document.getElementById("msg").textContent = "\u2705 " + label + " prêt !";
          document.getElementById("go-clip").disabled = false;
          updateFullClipButton();
          loadClips();
        } else if (d.status === "error") {
          clearInterval(pollTimer);
          document.getElementById("msg").textContent = "\u274C " + (d.error || "Erreur");
          document.getElementById("go-clip").disabled = false;
          updateFullClipButton();
        }
      }).catch(function() {});
    }, 8000);
  }

  function loadClips() {
    api("/api/mcp-bridge/clip/list").then(function(c) {
      var clips = c.clips || [];
      document.getElementById("clips").innerHTML = clips.length
        ? clips.map(function(x) { return '<div class="c"><a href="' + x.url + '" target="_blank">\uD83C\uDFAC ' + x.name + '</a></div>'; }).join("")
        : '<div class="empty">Aucun clip pour le moment</div>';
    }).catch(function() {});
  }

  function loadSongs() {
    api("/api/vivy/stream/songs.json").then(function(d) {
      var allVivySongs = (d.songs || []).map(function(s) {
        return {
          title: s.trackTitle || s.title || "Sans titre",
          playUrl: A + (s.trackUrl || ""),
          audioUrl: s.trackUrl ? (A + s.trackUrl) : "",
          date: s.createdAt ? s.createdAt.slice(0, 10) : "",
          duration: s.durationSeconds ? Math.round(s.durationSeconds) + "s" : "",
          source: s.source || "vivy",
          requestedBy: (s.requestedBy || "").toLowerCase()
        };
      });

      var vivySongs;
      if (isAdmin) {
        vivySongs = allVivySongs;
      } else if (userEmail) {
        var userLower = userEmail.toLowerCase();
        var userPrefix = userLower.split("@")[0];
        vivySongs = allVivySongs.filter(function(s) {
          if (!s.requestedBy) return false;
          return s.requestedBy === userLower
            || s.requestedBy === userPrefix
            || s.requestedBy.indexOf(userPrefix) !== -1;
        });
      } else {
        vivySongs = [];
      }

      // Admin also gets local catalog
      if (isAdmin) {
        api("/api/mcp-bridge/songs").then(function(local) {
          var localSongs = (local.songs || []).map(function(s) {
            return {
              title: s.title || "Sans titre",
              playUrl: A + "/api/mcp-bridge/play/" + s.filename,
              audioUrl: A + "/api/mcp-bridge/play/" + s.filename,
              date: s.date || "",
              duration: "",
              source: "local",
              requestedBy: ""
            };
          });
          var seen = {};
          songs = [];
          vivySongs.concat(localSongs).forEach(function(s) {
            var key = s.playUrl || s.title + s.date;
            if (!seen[key]) { seen[key] = true; songs.push(s); }
          });
          renderSongs();
        }).catch(function() { songs = vivySongs; renderSongs(); });
      } else {
        songs = vivySongs;
        renderSongs();
      }
    }).catch(function() {
      songs = [];
      renderSongs();
    });
  }

  function renderSongs() {
    document.getElementById("song-count").textContent = songs.length;
    document.getElementById("song").innerHTML = '<option value="">Choisir une chanson…</option>' +
      songs.map(function(s, i) { return '<option value="' + i + '">' + truncate(s.title, 45) + '</option>'; }).join("");

    document.getElementById("list").innerHTML = songs.length
      ? songs.map(function(s, i) {
          return '<div class="s">' +
            '<button class="play" data-idx="' + i + '">\u25B6</button>' +
            '<div class="info"><div class="title">' + truncate(s.title, 50) + '</div>' +
            '<div class="meta">' + [s.date, s.duration, s.source].filter(Boolean).join(" \u00B7 ") + '</div></div>' +
            '<button class="use" data-pick="' + i + '">utiliser</button></div>';
        }).join("")
      : '<div class="empty">' + (userEmail ? "Aucune chanson trouvée pour ton compte" : "Connecte-toi pour voir tes chansons") + '</div>';
  }

  function init() {
    api("/api/mcp-bridge/health").then(function(h) {
      document.getElementById("st").textContent = (h.upstreams && h.upstreams.comfy && h.upstreams.comfy.ok) ? "\u2705 En ligne" : "\u26A0\uFE0F Partiel";
    }).catch(function() { document.getElementById("st").textContent = "\u274C Hors ligne"; });

    checkAuth().then(function() { loadSongs(); });
    loadClips();
  }

  // Délégation d'événements
  document.getElementById("list").addEventListener("click", function(e) {
    var playBtn = e.target.closest(".play[data-idx]");
    if (playBtn) { play(parseInt(playBtn.dataset.idx, 10)); return; }
    var useBtn = e.target.closest(".use[data-pick]");
    if (useBtn) { pick(parseInt(useBtn.dataset.pick, 10)); }
  });

  document.getElementById("go-clip").addEventListener("click", function() { startClip("clip"); });
  document.getElementById("go-full").addEventListener("click", function() { startClip("full"); });

  document.getElementById("import-file").addEventListener("change", function(e) {
    var file = e.target.files[0];
    if (file) {
      importedFile = file;
      document.getElementById("file-name").textContent = "\uD83C\uDFB5 " + file.name;
      document.getElementById("song").value = "";
      document.getElementById("import-url").value = "";
    }
  });

  document.getElementById("import-url").addEventListener("input", function() {
    if (this.value.trim()) {
      importedFile = null;
      document.getElementById("file-name").textContent = "";
      document.getElementById("song").value = "";
    }
  });

  document.getElementById("song").addEventListener("change", function() {
    if (this.value) {
      importedFile = null;
      document.getElementById("import-url").value = "";
      document.getElementById("file-name").textContent = "";
    }
  });

  document.getElementById("audio").addEventListener("ended", function() {
    document.querySelectorAll(".s .play").forEach(function(btn) {
      btn.classList.remove("active");
      btn.textContent = "\u25B6";
    });
    currentIdx = null;
  });

  init();
  setInterval(function() { loadSongs(); }, 120000);
})();
</script>
</body>
</html>
