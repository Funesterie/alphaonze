services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: investigation_demo
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d investigation_demo"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 20

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: none
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - ./neo4j/schema.cypher:/schema.cypher:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      start_period: 45s
      interval: 15s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      APP_ENV: demo
      DEMO_MODE: "true"
      BACKEND_PORT: 8080
      RATE_LIMIT_PER_MINUTE: 60
      POSTGRES_HOST: postgres
      POSTGRES_DATABASE: investigation_demo
      NEO4J_URI: bolt://neo4j:7687
    ports:
      - "127.0.0.1:8089:8080"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  mcp-server:
    build: ./mcp-server
    environment:
      MCP_PORT: 8090
      BACKEND_URL: http://backend:8080
      MCP_READ_ONLY_BY_DEFAULT: "true"
    ports:
      - "127.0.0.1:8090:8090"
    depends_on:
      - backend

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      - backend
