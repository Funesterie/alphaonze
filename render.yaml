# Render Blueprint — A11 Backend
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: a11-backend
    env: node
    region: frankfurt
    plan: free
    branch: master
    rootDir: a11/backend/apps/server
    buildCommand: echo 'No build step needed for backend'
    startCommand: node server.cjs
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: HOST_SERVER
        value: 0.0.0.0
      - key: BACKEND
        value: render
      - key: NEZ_SECURITY_MODE
        value: production
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRY
        value: 7d
      - key: CORS_ORIGINS
        value: https://alphaonze.funesterie.pro
      - key: APP_URL
        value: https://alphaonze.funesterie.pro
      - key: A11_LLM_PROVIDER
        value: openai
      - key: DEFAULT_MODEL
        value: gpt-4o-mini
      - key: A11_LLM_TIMEOUT_MS
        value: 60000
      - key: OPENAI_API_KEY
        sync: false
      - key: A11_LLM_FALLBACK_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: TOGETHER_API_KEY
        sync: false
      - key: TOGETHER_MODEL
        value: meta-llama/Llama-3.3-70B-Instruct-Turbo
      - key: HF_API_KEY
        sync: false
      - key: HF_MODEL
        value: meta-llama/Llama-3.1-8B-Instruct
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        value: price_1TQwxHHkqLcMgv548uBa6GDZ
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_SUCCESS_URL
        value: https://alphaonze.funesterie.pro/subscription/success
      - key: STRIPE_CANCEL_URL
        value: https://alphaonze.funesterie.pro/subscription/cancel
      - key: STRIPE_PORTAL_RETURN_URL
        value: https://alphaonze.funesterie.pro/account
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: A11 <a11@funesterie.pro>
      - key: DATABASE_URL
        fromDatabase:
          name: a11-postgres
          property: connectionString
      - key: REDIS_URL
        fromDatabase:
          name: a11-redis
          property: connectionString
      - key: A11_ENABLE_QFLUSH
        value: 0
      - key: MANAGE_CERBERE
        value: false
      - key: MANAGE_TTS
        value: false

databases:
  - name: a11-postgres
    databaseName: a11
    plan: free
    region: frankfurt
    ipAllowList: []
  - name: a11-redis
    plan: free
    region: frankfurt
    ipAllowList: []
