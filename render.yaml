# Render Blueprint — A11 Backend
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: a11-backend
    runtime: node
    region: frankfurt
    plan: free
    branch: master
    rootDir: a11/backend/apps/server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: HOST_SERVER
        value: 0.0.0.0
      - key: BACKEND
        value: render
      - key: NEZ_SECURITY_MODE
        value: production
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRY
        value: 7d
      - key: A11_FULL_ACCESS_EMAILS
        value: cellaurojeffrey@gmail.com,marvincellauro@gmail.com,giovannabrunetto@gmail.com,bayetgerard@gmail.com,boostro38@gmail.com,charlenejewitt@gmail.com,jeffrey38330@gmail.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CORS_ORIGINS
        value: https://funesterie.me,https://a11.funesterie.me,https://k44.funesterie.me,https://vivy.funesterie.me
      - key: APP_URL
        value: https://a11.funesterie.me
      - key: PUBLIC_API_URL
        value: https://a11.funesterie.me
      - key: GOOGLE_CALLBACK_URL
        value: https://a11.funesterie.me/api/auth/google/callback
      - key: A11_GOOGLE_CALLBACK_URL
        value: https://a11.funesterie.me/api/auth/google/callback
      - key: A11_LLM_PROVIDER
        value: openai
      - key: DEFAULT_MODEL
        value: gpt-4o-mini
      - key: A11_LLM_TIMEOUT_MS
        value: 60000
      - key: OPENAI_API_KEY
        sync: false
      - key: A11_LLM_LLAMA
        sync: false
      - key: OLLAMA_API_KEY
        sync: false
      - key: A11_LLM_FALLBACK_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: TOGETHER_API_KEY
        sync: false
      - key: TOGETHER_MODEL
        value: meta-llama/Llama-3.3-70B-Instruct-Turbo
      - key: HF_API_KEY
        sync: false
      - key: HF_MODEL
        value: meta-llama/Llama-3.1-8B-Instruct
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        value: price_1TdqwVHkqLcMgv54LWqd5jEb
      - key: STRIPE_PREMIUM_PRICE_ID
        value: price_1TdqwVHkqLcMgv54LWqd5jEb
      - key: STRIPE_FOUNDER_PRICE_ID
        value: price_1TdqwWHkqLcMgv54ZFUAbVFl
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_WEBHOOK_URL
        value: https://a11.funesterie.me/api/subscription/webhook
      - key: STRIPE_SUCCESS_URL
        value: https://funesterie.me/subscription/success
      - key: STRIPE_CANCEL_URL
        value: https://funesterie.me/subscription/cancel
      - key: STRIPE_PORTAL_RETURN_URL
        value: https://funesterie.me/compte/

      # PayPal
      - key: PAYPAL_ENV
        value: live
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_PUBLIC_BASE_URL
        value: https://funesterie.me
      - key: PAYPAL_WEBHOOK_URL
        value: https://a11.funesterie.me/api/paypal/webhook
      - key: PAYPAL_RECEIVER_EMAIL
        value: cellaurojeffrey@hotmail.com
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: A11 <a11@funesterie.me>
      - key: DATABASE_URL
        fromDatabase:
          name: a11-postgres
          property: connectionString
      - key: A11_ENABLE_QFLUSH
        value: 0
      - key: MANAGE_CERBERE
        value: false
      - key: MANAGE_TTS
        value: false

databases:
  - name: a11-postgres
    databaseName: a11
    plan: basic-256mb
    region: frankfurt
    ipAllowList: []
