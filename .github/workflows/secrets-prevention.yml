name: Prevent Secrets in Code

on:
  pull_request:
    branches: [master]

jobs:
  gitleaks:
    name: Gitleaks - Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The marketplace action requires a commercial license for organizations.
      # Running the OSS CLI directly keeps the protection available during bootstrap.
      #
      # PR policy: scan only files introduced or modified by this pull request.
      # Pre-existing findings on master belong to a separate baseline cleanup and
      # must not make every unrelated PR permanently red. New findings still fail closed.
      - name: Prepare pull-request delta
        id: delta
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          scan_root="$RUNNER_TEMP/gitleaks-pr-delta"
          rm -rf "$scan_root"
          mkdir -p "$scan_root"

          count=0
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            [ -f "$file" ] || continue
            mkdir -p "$scan_root/$(dirname "$file")"
            cp -- "$file" "$scan_root/$file"
            count=$((count + 1))
          done < <(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA")

          echo "scan_root=$scan_root" >> "$GITHUB_OUTPUT"
          echo "file_count=$count" >> "$GITHUB_OUTPUT"
          echo "Prepared $count changed file(s) for secret scanning."

      - name: Install Gitleaks CLI
        if: steps.delta.outputs.file_count != '0'
        run: |
          go install github.com/zricethezav/gitleaks/v8@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/gitleaks" version

      - name: Run Gitleaks
        if: steps.delta.outputs.file_count != '0'
        shell: bash
        env:
          SCAN_ROOT: ${{ steps.delta.outputs.scan_root }}
        run: |
          set +e
          gitleaks detect \
            --source "$SCAN_ROOT" \
            --no-git \
            --no-banner \
            --redact \
            --verbose \
            --report-format json \
            --report-path gitleaks-report.json
          status=$?
          set -e

          if [ -s gitleaks-report.json ]; then
            node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const findings = JSON.parse(fs.readFileSync('gitleaks-report.json', 'utf8'));
          const scanRoot = path.resolve(process.env.SCAN_ROOT || '');
          for (const finding of findings.slice(0, 50)) {
            const absolute = path.resolve(String(finding.File || '.'));
            const relative = path.relative(scanRoot, absolute).replace(/\\/g, '/');
            const file = relative && !relative.startsWith('..') ? relative : 'changed-file';
            const line = Number(finding.StartLine || 1);
            const rule = String(finding.RuleID || 'secret-detection').replace(/\r|\n/g, '');
            console.log(`::error file=${file},line=${line}::Gitleaks rule ${rule}; detected value remains redacted.`);
          }
          NODE
          fi

          exit "$status"
