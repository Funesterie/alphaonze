name: Prevent Secrets in Code

on:
  pull_request:
    branches: [master]

jobs:
  gitleaks:
    name: Gitleaks - Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The marketplace action requires a commercial license for organizations.
      # Running the OSS CLI directly keeps the same protection available during bootstrap.
      - name: Install Gitleaks CLI
        run: |
          curl -sSfL https://raw.githubusercontent.com/gitleaks/gitleaks/master/scripts/install.sh | sh -s -- -b /usr/local/bin
          gitleaks version

      - name: Run Gitleaks
        run: gitleaks detect --source . --no-banner --redact --verbose
