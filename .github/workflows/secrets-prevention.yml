name: Prevent Secrets in Code

on:
  pull_request:
    branches: [master]

jobs:
  gitleaks:
    name: Gitleaks - Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # The marketplace action requires a commercial license for organizations.
      # Running the OSS CLI directly keeps the same protection available during bootstrap.
      - name: Install Gitleaks CLI
        run: |
          go install github.com/zricethezav/gitleaks/v8@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/gitleaks" version

      - name: Run Gitleaks
        shell: bash
        run: |
          set +e
          gitleaks detect \
            --source . \
            --no-git \
            --no-banner \
            --redact \
            --verbose \
            --report-format json \
            --report-path gitleaks-report.json
          status=$?
          set -e

          if [ -s gitleaks-report.json ]; then
            node <<'NODE'
          const fs = require('node:fs');
          const findings = JSON.parse(fs.readFileSync('gitleaks-report.json', 'utf8'));
          for (const finding of findings.slice(0, 50)) {
            const file = String(finding.File || '.').replace(/\r|\n/g, '');
            const line = Number(finding.StartLine || 1);
            const rule = String(finding.RuleID || 'secret-detection').replace(/\r|\n/g, '');
            console.log(`::error file=${file},line=${line}::Gitleaks rule ${rule}; detected value remains redacted.`);
          }
          NODE
          fi

          exit "$status"
