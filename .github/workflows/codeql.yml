name: CodeQL Security Analysis

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 3 * * 0" # Dimanche à 3h

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        continue-on-error: ${{ github.event.repository.private && vars.ENABLE_CODEQL != 'true' }}
        with:
          category: "/language:${{ matrix.language }}"

      - name: CodeQL bootstrap note
        if: ${{ github.event.repository.private && vars.ENABLE_CODEQL != 'true' }}
        run: |
          echo "CodeQL upload may require GitHub Advanced Security on private repos."
          echo "Set repository variable ENABLE_CODEQL=true once code scanning is enabled."
