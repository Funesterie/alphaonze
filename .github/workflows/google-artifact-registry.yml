name: Google Artifact Registry

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish packages instead of dry-run"
        required: false
        type: boolean
        default: false
  pull_request:
    branches: [master, codex/prod-ui-oauth-20260518]
    paths:
      - "a11/backend/libs/**"
      - "scripts/google/**"
      - "scripts/github/Publish-GitHubPackages.ps1"
      - "docs/GOOGLE_ARTIFACT_REGISTRY.md"
      - "package.json"
      - ".github/workflows/google-artifact-registry.yml"
  push:
    branches: [master, codex/prod-ui-oauth-20260518]
    tags:
      - "packages/*"
    paths:
      - "a11/backend/libs/**"
      - "scripts/google/**"
      - "scripts/github/Publish-GitHubPackages.ps1"
      - "docs/GOOGLE_ARTIFACT_REGISTRY.md"
      - "package.json"
      - ".github/workflows/google-artifact-registry.yml"

permissions:
  contents: read
  id-token: write

jobs:
  npm-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOOGLE_CLOUD_PROJECT: ${{ vars.GAR_PROJECT_ID || 'alphaonze' }}
      GAR_LOCATION: ${{ vars.GAR_LOCATION || 'europe-west4' }}
      GAR_NPM_REPOSITORY: ${{ vars.GAR_NPM_REPOSITORY || 'funesterie-npm' }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Dry-run package mirrors
        shell: pwsh
        run: ./scripts/google/Publish-GoogleArtifactRegistry.ps1 -DryRun

      - name: Authenticate to Google Cloud
        if: ${{ startsWith(github.ref, 'refs/tags/packages/') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        if: ${{ startsWith(github.ref, 'refs/tags/packages/') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        uses: google-github-actions/setup-gcloud@v3

      - name: Publish package mirrors
        if: ${{ startsWith(github.ref, 'refs/tags/packages/') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        shell: pwsh
        run: ./scripts/google/Publish-GoogleArtifactRegistry.ps1 -Publish
