name: A11 MCP Standalone Tests
on:
  push:
    paths:
      - 'cloudflare/a11-mcp-standalone/**'
      - '.github/workflows/a11-mcp-standalone-tests.yml'
  pull_request:
    paths:
      - 'cloudflare/a11-mcp-standalone/**'
      - '.github/workflows/a11-mcp-standalone-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cloudflare/a11-mcp-standalone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
