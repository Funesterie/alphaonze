name: GitHub Packages

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish packages instead of dry-run"
        required: false
        type: boolean
        default: false
  pull_request:
    branches: [master]
    paths:
      - "a11/backend/libs/**"
      - "scripts/github/**"
      - "docs/GITHUB_PACKAGES_AND_GHCR.md"
      - "package.json"
      - ".github/workflows/github-packages.yml"
  push:
    branches: [master]
    tags:
      - "packages/*"
    paths:
      - "a11/backend/libs/**"
      - "scripts/github/**"
      - "docs/GITHUB_PACKAGES_AND_GHCR.md"
      - "package.json"
      - ".github/workflows/github-packages.yml"

permissions:
  contents: read
  packages: write

jobs:
  npm-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@funesterie"

      - name: Create npm userconfig
        shell: pwsh
        run: ./scripts/github/Write-GitHubNpmrc.ps1

      - name: Dry-run package mirrors
        shell: pwsh
        run: ./scripts/github/Publish-GitHubPackages.ps1 -DryRun

      - name: Publish package mirrors
        if: ${{ startsWith(github.ref, 'refs/tags/packages/') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        shell: pwsh
        run: ./scripts/github/Publish-GitHubPackages.ps1 -Publish
