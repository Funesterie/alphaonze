name: Security Scan

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Chaque lundi à 6h

jobs:
  secret-scan:
    name: Scan for leaked secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve TruffleHog scan range
        id: trufflehog_range
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            base="$(git rev-list --max-count=1 --before='14 days ago' HEAD || true)"
            if [[ -z "$base" ]]; then
              base="$(git rev-list --max-parents=0 HEAD)"
            fi
            head="HEAD"
          else
            before="${{ github.event.before }}"
            head="${{ github.sha }}"
            if [[ -z "$before" || "$before" == "0000000000000000000000000000000000000000" ]]; then
              base=""
            else
              base="$before"
            fi
          fi

          skip="false"
          base_commit=""
          head_commit="$(git rev-parse "$head" 2>/dev/null || true)"
          if [[ -n "$base" ]]; then
            base_commit="$(git rev-parse "$base" 2>/dev/null || true)"
          fi
          if [[ -n "$base_commit" && -n "$head_commit" && "$base_commit" == "$head_commit" ]]; then
            skip="true"
          fi

          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: Skip unchanged scheduled secret scan
        if: steps.trufflehog_range.outputs.skip == 'true'
        run: echo "No commits in the scheduled scan window."

      - name: TruffleHog — scan secrets in git history
        if: steps.trufflehog_range.outputs.skip != 'true'
        uses: trufflesecurity/trufflehog@v3.97.1
        with:
          path: ./
          base: ${{ steps.trufflehog_range.outputs.base }}
          head: ${{ steps.trufflehog_range.outputs.head }}
          version: 3.95.5
          extra_args: --only-verified

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Audit backend dependencies
        run: npm audit --audit-level=high
        working-directory: a11/backend/apps/server
        continue-on-error: true

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
        working-directory: a11/frontend/apps/web
        continue-on-error: true
