name: Build & Push A11 to GHCR

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - "a11/backend/apps/server/**"
      - ".github/workflows/docker-build-push.yml"
  push:
    branches: [master]
    paths:
      - "a11/backend/apps/server/**"
      - ".github/workflows/docker-build-push.yml"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REGISTRY: ghcr.io
      GHCR_IMAGE: ${{ vars.GHCR_IMAGE || 'a11-backend' }}
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DOCKER_BUILDKIT: "1"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve image name
        id: image
        shell: bash
        run: |
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image="$(printf '%s/%s/%s' "$REGISTRY" "$owner" "$GHCR_IMAGE" | tr '[:upper:]' '[:lower:]')"
          echo "name=$image" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          printf '%s' "$NODE_AUTH_TOKEN" | docker login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin

      - name: Build Docker image
        shell: bash
        run: |
          docker build \
            --secret id=npm_token,env=NODE_AUTH_TOKEN \
            --file a11/backend/apps/server/Dockerfile \
            --tag "${{ steps.image.outputs.name }}:latest" \
            --tag "${{ steps.image.outputs.name }}:${GITHUB_SHA}" \
            a11/backend/apps/server

      - name: Push Docker image
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          docker push "${{ steps.image.outputs.name }}:latest"
          docker push "${{ steps.image.outputs.name }}:${GITHUB_SHA}"
