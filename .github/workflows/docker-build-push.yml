name: Build & Push A11 to GHCR

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - "a11/backend/apps/server/**"
      - ".github/workflows/docker-build-push.yml"
  push:
    branches: [master]
    paths:
      - "a11/backend/apps/server/**"
      - ".github/workflows/docker-build-push.yml"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REGISTRY: ghcr.io
      GHCR_IMAGE: ${{ vars.GHCR_IMAGE || 'a11-backend' }}
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DOCKER_BUILDKIT: "1"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js for contract tests
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: a11/backend/apps/server/package-lock.json

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - name: Install backend dependencies
        working-directory: a11/backend/apps/server
        run: npm ci

      - name: Run backend contract tests
        working-directory: a11/backend/apps/server
        run: npm test

      - name: Resolve image name
        id: image
        shell: bash
        run: |
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image="$(printf '%s/%s/%s' "$REGISTRY" "$owner" "$GHCR_IMAGE" | tr '[:upper:]' '[:lower:]')"
          echo "name=$image" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          printf '%s' "$NODE_AUTH_TOKEN" | docker login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: a11/backend/apps/server
          file: a11/backend/apps/server/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha,scope=a11-backend
          cache-to: type=gha,mode=max,scope=a11-backend
