name: Build & Push A11 to Docker Hub

on:
  push:
    branches: [master]
    paths:
      - "a11/backend/apps/server/**"
      - ".github/workflows/docker-build-push.yml"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: funeste38
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check Docker Hub credentials
        id: dockerhub
        shell: bash
        run: |
          if [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Docker Hub push skipped::Repository secret DOCKERHUB_TOKEN is not configured; validating the Docker build without pushing."
          fi

      - name: Login to Docker Hub
        if: steps.dockerhub.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and optionally push
        uses: docker/build-push-action@v7
        with:
          context: a11/backend/apps/server
          file: a11/backend/apps/server/Dockerfile
          push: ${{ steps.dockerhub.outputs.push == 'true' }}
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/a11:latest
            ${{ env.DOCKERHUB_USERNAME }}/a11:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
