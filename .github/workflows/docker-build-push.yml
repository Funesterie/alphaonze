name: Build & Push A11 to Docker Hub

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "a11/backend/apps/server/**"
      - ".github/workflows/docker-build-push.yml"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME || 'funesterie' }}
      DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'a11-backend' }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      JFROG_NPM_AUTH_TOKEN: ${{ secrets.JFROG_NPM_AUTH_TOKEN }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check Docker Hub credentials
        id: dockerhub
        shell: bash
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Docker Hub push skipped::Repository secret DOCKERHUB_TOKEN is not configured; validating the Docker build without pushing."
          elif printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Docker Hub push skipped::Docker Hub credentials were provided but login failed for user '$DOCKERHUB_USERNAME'. Validating the Docker build without pushing."
          fi

      - name: Build Docker image
        shell: bash
        run: |
          build_args=()
          if [ -n "$JFROG_NPM_AUTH_TOKEN" ]; then
            build_args+=(--build-arg JFROG_NPM_AUTH_TOKEN)
          fi

          docker build "${build_args[@]}" \
            --file a11/backend/apps/server/Dockerfile \
            --tag "$DOCKERHUB_USERNAME/$DOCKERHUB_IMAGE:latest" \
            --tag "$DOCKERHUB_USERNAME/$DOCKERHUB_IMAGE:${GITHUB_SHA}" \
            a11/backend/apps/server

      - name: Push Docker image
        if: steps.dockerhub.outputs.push == 'true'
        shell: bash
        run: |
          docker push "$DOCKERHUB_USERNAME/$DOCKERHUB_IMAGE:latest"
          docker push "$DOCKERHUB_USERNAME/$DOCKERHUB_IMAGE:${GITHUB_SHA}"
